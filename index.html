/* ---------- instrument view ---------- */
function renderInstrumentView() {
  if (!state.data.instruments.length) {
    return `<section><h1>Instruments</h1><p class="empty-hint">No instruments yet — add one in Settings.</p></section>`;
  }
  if (!state.activeInstrumentId || !getInstrument(state.activeInstrumentId)) {
    state.activeInstrumentId = state.data.instruments[0].id;
  }
  const inst = getInstrument(state.activeInstrumentId);
  const instSelector = state.data.instruments.map(function (i) {
    return `<button data-action="select-instrument" data-instrument="${i.id}" class="chip ${i.id===inst.id?'active':''}">${esc(i.name)}<span class="chip-serial">${esc(i.serial)}</span></button>`;
  }).join('');

  if (state.activeAssayIndex >= inst.assays.length) state.activeAssayIndex = 0;
  const assayTabs = inst.assays.map(function (a,idx) {
    return `<button data-action="select-assay" data-assay="${idx}" class="tab ${idx===state.activeAssayIndex?'active':''}">${esc(a.name)}</button>`;
  }).join('');

  const assay = inst.assays[state.activeAssayIndex];
  const evalLevels = assay ? getEvaluatedAssay(inst, state.activeAssayIndex) : [];
  const levelPanels = evalLevels.map(function (lvl) {
    return renderLevelPanel(inst, state.activeAssayIndex, lvl, assay.unit || '');
  }).join('');

  return `
    <section class="instrument-view">
      ${printHeader('Quality Control — Levey-Jennings Report',
         `${inst.name} (S/N ${inst.serial})${assay?' — '+assay.name:''}`)}
      <div class="inst-selector no-print">${instSelector}</div>
      <h1>${esc(inst.name)} <span class="muted">S/N ${esc(inst.serial)}</span></h1>
      ${inst.assays.length ? `<div class="assay-tabs no-print">${assayTabs}</div>` : ''}
      ${assay ? `<h2 class="assay-title">${esc(assay.name)} ${assay.unit?`<span class="muted">(${esc(assay.unit)})</span>`:''}</h2>` : ''}
      ${assay ? renderContextLine(inst, assay, evalLevels) : ''}
      ${assay ? levelPanels : '<p class="empty-hint">No assays configured for this instrument yet — add one in Settings.</p>'}
    </section>`;
}

/* Compact "which control am I looking at" line under the assay heading. */
function renderContextLine(inst, assay, evalLevels) {
  if (!evalLevels.length) return '';
  const a = evalLevels[0].applicable;
  const parts = [];
  if (a.controlName) parts.push('Control: ' + esc(a.controlName));
  const lots = evalLevels.map(function (l) { return l.applicable.lot; }).filter(Boolean);
  const uniqueLots = lots.filter(function (v,i,arr) { return arr.indexOf(v)===i; });
  if (uniqueLots.length === 1) parts.push('Lot: ' + esc(uniqueLots[0]));
  else if (uniqueLots.length > 1) parts.push('Lots: ' + uniqueLots.map(function (l,i) { return 'L'+(i+1)+' '+esc(l); }).join(' / '));
  evalLevels.forEach(function (l) {
    if (l.applicable.expiry) parts.push(`L${l.level} exp ${esc(fmtDate(l.applicable.expiry))}`);
  });
  const srcBadge = a.source==='override'
    ? ' <span class="pill pill-override">Instrument override</span>'
    : a.source==='shared' ? ' <span class="pill pill-shared">Shared configuration</span>' : '';
  const worstExp = evalLevels.map(function (l) { return expiryStatus(l.applicable.expiry); })
    .sort(function (x,y) { const r={expired:3,soon:2,ok:1,none:0}; return r[y.state]-r[x.state]; })[0];
  const expBadge = (worstExp && (worstExp.state==='expired'||worstExp.state==='soon'))
    ? ` <span class="pill ${worstExp.state==='expired'?'pill-expired':'pill-soon'}">${esc(worstExp.label)}</span>` : '';
  if (!parts.length) return '';
  return `<p class="context-line">${parts.join('<span class="sep">|</span>')}${srcBadge}${expBadge}</p>`;
}

function renderLevelPanel(inst, assayIndex, lvl, unit) {
  const key = inst.id + '|' + assayIndex + '|' + lvl.level;
  const sel = (state.selected && state.selected.key===key) ? state.selected.pointIndex : null;
  const points = lvl.points;
  const a = lvl.applicable;
  const WINDOW = 25;
  const offset = Math.max(0, points.length - WINDOW);
  const visible = points.slice(offset);
  const configured = isFinite(a.mean) && a.sd > 0;
  const rangeLo = configured ? fmtNum(a.mean - 2*a.sd) : '—';
  const rangeHi = configured ? fmtNum(a.mean + 2*a.sd) : '—';
  const selPoint = (sel!=null && points[sel]) ? points[sel] : null;
  const violations = points.filter(function (p) { return p.flags && p.flags.length; });
  const chartHtml = configured
    ? buildChartSVG(key, offset, visible, sel)
    : `<div class="empty-chart">${inst.sharedProfile
        ? 'No shared target set for this analyte/level yet — add Mean and SD in Settings &rarr; Electrolyte Control.'
        : 'Set a mean and SD for this level in Settings to start plotting.'}</div>`;

  return `
  <div class="level-panel">
    <div class="level-info">
      <div class="li-row"><span>Level</span><strong>${lvl.level}</strong></div>
      <div class="li-row"><span>Control</span><strong>${esc(a.controlName||'—')}</strong></div>
      <div class="li-row"><span>Lot</span><strong>${esc(a.lot||'—')}</strong></div>
      <div class="li-row"><span>Exp.</span><strong>${esc(a.expiry?fmtDate(a.expiry):'—')}</strong></div>
      <div class="li-row"><span></span><span>${expiryPill(a.expiry)}</span></div>
      <div class="li-row"><span>N</span><strong class="num">${points.length}</strong></div>
      <div class="li-row"><span>Mean</span><strong class="num">${fmtNum(a.mean)}</strong></div>
      <div class="li-row"><span>SD</span><strong class="num">${fmtNum(a.sd)}</strong></div>
      <div class="li-row"><span>Range (&plusmn;2SD)</span><strong class="num">${rangeLo}&ndash;${rangeHi}</strong></div>
      ${a.source==='override' ? `<div class="li-row"><span></span><span class="pill pill-override">Instrument override</span></div>` : ''}
    </div>
    <div class="level-chart">
      ${chartHtml}
      <div class="chart-footer no-print">
        ${selPoint ? `
          <button data-action="step-point" data-dir="-1" ${sel<=0?'disabled':''}>&lsaquo; Prev</button>
          <div class="detail-readout"><strong>${fmtDateTime(selPoint.datetime)}</strong> &mdash; value ${selPoint.value} ${esc(unit)}
            ${selPoint.z!=null?`<span class="muted">(z ${selPoint.z>0?'+':''}${fmtNum(selPoint.z)})</span>`:''}
            ${selPoint.operator?`<span class="muted">&middot; ${esc(selPoint.operator)}</span>`:''}
            ${selPoint.flags.length ? selPoint.flags.map(function (f) { return `<span class="flag-pill sev-${f.severity}">${esc(f.rule)}</span>`; }).join('') : '<span class="flag-pill sev-ok">In control</span>'}
          </div>
          <button data-action="step-point" data-dir="1" ${sel>=points.length-1?'disabled':''}>Next &rsaquo;</button>
          <button data-action="open-note" data-key="${key}" data-point-id="${selPoint.id}">${selPoint.comment||selPoint.correctiveAction?'Edit note':'Add note'}</button>
        ` : `<div class="detail-readout">Click a point on the chart to see its date, value and rule status.</div>`}
      </div>
      ${selPoint && (selPoint.comment || selPoint.correctiveAction || selPoint.resolution) ? `
        <div class="note-shown">
          ${selPoint.resolution?`<strong>${esc(selPoint.resolution)}</strong> &middot; `:''}
          ${selPoint.comment?esc(selPoint.comment):''}${selPoint.comment&&selPoint.correctiveAction?' &middot; ':''}
          ${selPoint.correctiveAction?'Action: '+esc(selPoint.correctiveAction):''}
        </div>` : ''}
      ${renderNoteEditor(key, selPoint, inst.id, assayIndex, lvl.level)}
      <form class="quick-add no-print" data-action="quick-add" data-instrument="${inst.id}" data-assay="${assayIndex}" data-level="${lvl.level}">
        <label>Date/time <input type="datetime-local" name="dt" value="${nowLocalInputValue()}" required></label>
        <label>Value <input type="number" step="any" name="val" required></label>
        <label>Operator <input type="text" name="op" placeholder="initials" size="6"></label>
        <button type="submit">Add result</button>
      </form>
    </div>
  </div>
  ${violations.length ? `
  <div class="violation-mini">
    <strong>${violations.length} flagged result${violations.length===1?'':'s'} &mdash; Level ${lvl.level}</strong>
    <ul>${violations.map(function (v) {
      return `<li>${fmtDateTime(v.datetime)} &mdash; ${v.value} &mdash; ${v.flags.map(function (f) { return esc(f.rule); }).join(', ')}${v.resolution?` <em>(${esc(v.resolution)})</em>`:''}</li>`;
    }).join('')}</ul>
  </div>` : ''}
  `;
}

function renderNoteEditor(key, selPoint, instId, assayIndex, levelNum) {
  if (!state.noteEditor || state.noteEditor.key !== key || !selPoint || state.noteEditor.pointId !== selPoint.id) return '';
  const statuses = ['','Open','Investigating','Resolved'];
  return `
    <form class="note-editor no-print" data-action="save-note" data-instrument="${instId}" data-assay="${assayIndex}" data-level="${levelNum}" data-point-id="${selPoint.id}">
      <div class="row">
        <label>Comment <input type="text" name="comment" value="${esc(selPoint.comment||'')}" placeholder="e.g. new reagent pack loaded"></label>
        <label>Corrective action <input type="text" name="action" value="${esc(selPoint.correctiveAction||'')}" placeholder="e.g. recalibrated, repeated control"></label>
        <label>Status <select name="resolution">${statuses.map(function (s) {
          return `<option value="${s}" ${((selPoint.resolution||'')===s)?'selected':''}>${s||'— not set —'}</option>`;
        }).join('')}</select></label>
      </div>
      <div class="editor-actions">
        <button type="submit" class="primary">Save note</button>
        <button type="button" data-action="cancel-note">Cancel</button>
      </div>
    </form>`;
}

/* ---------- batch electrolyte QC run entry ----------
   One date/time and operator for the whole run; values are written into the
   correct instrument/assay/level. Partial entry is allowed. */
function ensureBatchDraft() {
  if (!state.batchDraft) state.batchDraft = { datetime: nowLocalInputValue(), operator: '', values: {} };
  return state.batchDraft;
}
function batchKey(instId, assayName, level) { return instId + '||' + assayName + '||' + level; }

function renderBatchView() {
  const electro = getElectrolyteInstruments();
  if (!electro.length) {
    return `<section><h1>QC run entry</h1><p class="empty-hint">No instruments are using the shared electrolyte configuration. Assign one in Settings.</p></section>`;
  }
  const draft = ensureBatchDraft();
  const lot = getActiveControlLot('electrolyte');
  const expState = lotExpiryState(lot);

  const blocks = electro.map(function (inst) {
    const analytes = inst.assays.map(function (a) { return a.name; });
    const header = `<div class="bh"></div>` + analytes.map(function (n) { return `<div class="bh">${esc(n)}</div>`; }).join('');
    const rows = [1,2].map(function (levelNum) {
      const cells = inst.assays.map(function (assay) {
        const lvl = assay.levels.find(function (l) { return l.level === levelNum; });
        if (!lvl) return `<div class="muted">—</div>`;
        const a = getApplicableQCSettings(inst, assay.name, lvl);
        const k = batchKey(inst.id, assay.name, levelNum);
        const target = (isFinite(a.mean) && a.sd>0) ? `${fmtNum(a.mean)} &plusmn; ${fmtNum(2*a.sd)}` : 'no target set';
        return `<div>
          <input type="number" step="any" data-action="batch-input" data-bkey="${k}" value="${draft.values[k]!=null?esc(draft.values[k]):''}" placeholder="${esc(assay.name)} L${levelNum}">
          <div class="batch-target">${target}</div>
        </div>`;
      }).join('');
      return `<div class="blabel">Level ${levelNum}</div>` + cells;
    }).join('');
    return `
      <div class="batch-instrument">
        <h3>${esc(inst.name)}</h3>
        <div class="batch-serial">S/N ${esc(inst.serial)}</div>
        <div class="batch-grid">${header}${rows}</div>
      </div>`;
  }).join('');

  return `
    <section class="batch-view">
      <h1>Enter electrolyte QC run</h1>
      <p class="muted">One date/time and operator for the whole run. Leave any field blank to skip it — nothing is required. Each value is stored against its own analyzer and evaluated separately.</p>
      ${lot ? `<p class="context-line">Control: ${esc(lot.controlName)}<span class="sep">|</span>L1 lot ${esc(lot.level1.lot||'—')}<span class="sep">|</span>L2 lot ${esc(lot.level2.lot||'—')} ${expState.state==='expired'||expState.state==='soon'?`<span class="pill ${expState.state==='expired'?'pill-expired':'pill-soon'}">${esc(expState.label)}</span>`:''}</p>` : ''}
      ${expState.state==='expired' ? `<div class="errorbox">The active control lot is past its expiry date. Results can still be recorded, but review the lot in Settings.</div>` : ''}
      <div class="batch-head">
        <label>Date &amp; time <input type="datetime-local" data-action="batch-datetime" value="${esc(draft.datetime)}"></label>
        <label>Operator / technician <input type="text" data-action="batch-operator" value="${esc(draft.operator)}" placeholder="initials" size="8"></label>
      </div>
      ${blocks}
      <div class="editor-actions">
        <button class="primary" data-action="save-batch">Save QC run</button>
        <button data-action="clear-batch">Clear form</button>
      </div>
    </section>`;
}

/* ---------- violations log ---------- */
function renderViolationsView() {
  let rows = collectViolations();
  rows.sort(function (a,b) {
    return state.violationSort==='asc' ? String(a.date).localeCompare(String(b.date)) : String(b.date).localeCompare(String(a.date));
  });
  if (state.violationFilter) rows = rows.filter(function (r) { return r.severity === state.violationFilter; });
  if (state.resolutionFilter) rows = rows.filter(function (r) { return (r.resolution||'Open') === state.resolutionFilter; });

  const body = rows.map(function (r, i) {
    const rowKey = r.instrumentId + '|' + r.assayIndex + '|' + r.level + '|' + r.pointId + '|' + r.rule;
    const expanded = state.expandedViolation === rowKey;
    let html = `<tr class="sev-row-${r.severity} clickable" data-action="toggle-violation" data-vkey="${esc(rowKey)}">
      <td class="num">${fmtDateTime(r.date)}</td>
      <td>${esc(r.instrument)}</td>
      <td class="num">${esc(r.serial)}</td>
      <td>${esc(r.assay)}</td>
      <td class="num">L${r.level}</td>
      <td class="num">${r.value}</td>
      <td>${esc(r.rule)}</td>
      <td><span class="flag-pill sev-${r.severity}">${r.severity}</span></td>
      <td>${esc(r.resolution||'Open')}</td>
    </tr>`;
    if (expanded) {
      html += `<tr class="v-detail"><td colspan="9">
        <div class="v-detail-grid">
          <div><span>Control</span>${esc(r.controlName||'—')}</div>
          <div><span>Lot</span>${esc(r.lot||'—')}</div>
          <div><span>Mean at time of testing</span>${fmtNum(r.mean)}</div>
          <div><span>SD at time of testing</span>${fmtNum(r.sd)}</div>
          <div><span>Z-score</span>${r.z!=null?(r.z>0?'+':'')+fmtNum(r.z):'—'}</div>
          <div><span>Operator</span>${esc(r.operator||'—')}</div>
          <div><span>Comment</span>${esc(r.comment||'—')}</div>
          <div><span>Corrective action</span>${esc(r.correctiveAction||'—')}</div>
        </div>
        <div class="editor-actions no-print">
          <button class="small" data-action="goto-violation" data-instrument="${r.instrumentId}" data-assay="${r.assayIndex}" data-level="${r.level}" data-point-id="${r.pointId}">Open on chart</button>
        </div>
      </td></tr>`;
    }
    return html;
  }).join('');

  return `
    <section class="violations-view">
      ${printHeader('Quality Control — Westgard Violations Log')}
      <h1>Violations log</h1>
      <div class="v-controls no-print">
        <label>Severity
          <select data-action="filter-violations">
            <option value="" ${!state.violationFilter?'selected':''}>All</option>
            <option value="reject" ${state.violationFilter==='reject'?'selected':''}>Reject only</option>
            <option value="warning" ${state.violationFilter==='warning'?'selected':''}>Warning only</option>
          </select>
        </label>
        <label>Status
          <select data-action="filter-resolution">
            <option value="" ${!state.resolutionFilter?'selected':''}>All</option>
            <option value="Open" ${state.resolutionFilter==='Open'?'selected':''}>Open</option>
            <option value="Investigating" ${state.resolutionFilter==='Investigating'?'selected':''}>Investigating</option>
            <option value="Resolved" ${state.resolutionFilter==='Resolved'?'selected':''}>Resolved</option>
          </select>
        </label>
        <button data-action="toggle-sort-violations">Sort: ${state.violationSort==='asc'?'Oldest first':'Newest first'}</button>
        <button data-action="export-violations-csv">Export CSV</button>
      </div>
      ${rows.length ? `
      <table class="v-table">
        <thead><tr><th>Date</th><th>Instrument</th><th>Serial No.</th><th>Assay</th><th>Level</th><th>Value</th><th>Rule</th><th>Severity</th><th>Status</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
      <p class="muted no-print" style="font-size:.78rem;margin-top:.5rem">Click any row for control lot, mean/SD in force at the time, z-score, operator and corrective action.</p>
      ` : `<p class="empty-hint">No Westgard rule violations recorded${(state.violationFilter||state.resolutionFilter)?' for this filter':''}.</p>`}
    </section>`;
}

/* ---------- settings ---------- */
function renderSettingsView() {
  const ruleDefs = [['r12s','1-2s (warning)'],['r13s','1-3s'],['r22s','2-2s'],['r4s','R-4s'],['r41s','4-1s'],['r7t','7-T (trend)']];
  const ruleRows = ruleDefs.map(function (rd) {
    return `<label class="rule-toggle"><input type="checkbox" data-action="toggle-rule" data-rule="${rd[0]}" ${state.rules[rd[0]]?'checked':''}> ${rd[1]}</label>`;
  }).join('');
  const nRuleRow = `<label class="rule-toggle"><input type="checkbox" data-action="toggle-rule" data-rule="rNx" ${state.rules.rNx?'checked':''}> Same-side-of-mean rule, N =
      <select data-action="set-rule-n">${[8,9,10,12].map(function (n) { return `<option value="${n}" ${state.rules.rNxN===n?'selected':''}>${n}</option>`; }).join('')}</select></label>`;

  return `
    <section class="settings-view">
      ${printHeader('Quality Control — Configuration Summary')}
      <h1>Settings</h1>

      <h2 class="group-label">Shared QC configurations</h2>
      ${renderSharedProfileSection()}

      <div class="settings-card">
        <h2>Westgard rules in use</h2>
        <p class="muted">Turn rules on or off to match your lab's multirule protocol. The same-side rule (10-x by default) is an alternate run-length &mdash; most labs use one setting, not several at once. Rules are always evaluated per analyzer; results from different instruments are never combined.</p>
        <div class="rule-grid no-print">${ruleRows}${nRuleRow}</div>
      </div>

      <div class="settings-card no-print">
        <h2>Data</h2>
        <div class="data-actions">
          <button data-action="export-json">Export all data (JSON)</button>
          <button data-action="trigger-import">Import data (JSON)</button>
          <button data-action="export-full-csv">Export all results (CSV)</button>
          <button data-action="clear-all-results" class="danger">Clear all QC results</button>
        </div>
        <div class="data-actions" style="border-top:1px dashed var(--line);padding-top:.7rem">
          <label>From <input type="date" id="report-from" value="${esc(state.reportFrom||'')}"></label>
          <label>To <input type="date" id="report-to" value="${esc(state.reportTo||'')}"></label>
          <button data-action="export-electrolyte-report">Export electrolyte QC report (CSV)</button>
          <button data-action="print-electrolyte-report">Print electrolyte QC report</button>
        </div>
        <p class="muted">This dashboard has no server &mdash; <strong>Export</strong> regularly and commit the file to your GitHub repo, since clearing your browser data will otherwise clear this dashboard too. Exports use schema v2; older backups are migrated automatically on import.</p>
      </div>

      <div class="settings-card">
        <h2>Instruments &amp; assays</h2>
        ${state.data.instruments.map(renderInstrumentSettings).join('')}
        <form class="add-instrument-form no-print" data-action="add-instrument">
          <input type="text" name="name" placeholder="Instrument name" required>
          <input type="text" name="serial" placeholder="Serial number" required>
          <button type="submit">Add instrument</button>
        </form>
      </div>

      ${state.data.changeLog && state.data.changeLog.length ? `
      <div class="settings-card no-print">
        <h2>Change history</h2>
        <div class="changelog-list">
          ${state.data.changeLog.slice().reverse().slice(0,60).map(function (c) {
            return `<div><strong>${esc(fmtDateTime(c.at))}</strong> — ${esc(c.detail)}</div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </section>`;
}

function renderSharedProfileSection() {
  const profile = getSharedControlProfile('electrolyte');
  if (!profile) {
    return `<div class="settings-card"><p class="empty-hint">No shared electrolyte configuration exists yet.</p></div>`;
  }
  if (state.editingProfile && state.editingProfile.profileId === 'electrolyte') return renderProfileEditor();

  const lot = getActiveControlLot('electrolyte');
  const insts = getElectrolyteInstruments();
  const st = lotExpiryState(lot);
  const archived = getArchivedLots('electrolyte');

  const targetRows = ELECTROLYTE_ANALYTES.map(function (an) {
    return [1,2].map(function (lv) {
      const t = lot && lot.analytes[an] && lot.analytes[an]['level'+lv];
      const mean = t ? t.mean : null, sd = t ? t.sd : null;
      const configured = isFinite(mean) && sd > 0;
      return `<tr>
        <td>${esc(an)}</td><td class="num">L${lv}</td>
        <td class="num">${configured?fmtNum(mean):'—'}</td>
        <td class="num">${configured?fmtNum(sd):'—'}</td>
        <td class="calc">${configured?fmtNum(mean-2*sd):'—'}</td>
        <td class="calc">${configured?fmtNum(mean+2*sd):'—'}</td>
      </tr>`;
    }).join('');
  }).join('');

  return `
    <div class="settings-card accent">
      <div class="profile-card">
        <div>
          <h2>Electrolyte Control — EasyLyte Plus &times;${insts.length}</h2>
          <div class="serial-list">${insts.map(function (i) { return esc(i.serial); }).join(' &nbsp;·&nbsp; ') || '—'}</div>
          <div class="profile-facts">
            <div><span>Control name</span><strong>${esc(lot?lot.controlName:'—')}</strong></div>
            <div><span>Level 1 lot</span><strong>${esc(lot&&lot.level1.lot?lot.level1.lot:'—')}</strong></div>
            <div><span>Level 1 expiry</span><strong>${lot?esc(fmtDate(lot.level1.expiry)):'—'}</strong> ${lot?expiryPill(lot.level1.expiry):''}</div>
            <div><span>Level 2 lot</span><strong>${esc(lot&&lot.level2.lot?lot.level2.lot:'—')}</strong></div>
            <div><span>Level 2 expiry</span><strong>${lot?esc(fmtDate(lot.level2.expiry)):'—'}</strong> ${lot?expiryPill(lot.level2.expiry):''}</div>
            <div><span>Status</span><strong>${st.state==='expired'?'EXPIRED':'Active'}</strong></div>
          </div>
        </div>
        <div class="profile-actions no-print">
          <button data-action="edit-profile" data-profile="electrolyte">Edit configuration</button>
          <button data-action="new-lot" data-profile="electrolyte">Create new lot</button>
          <button data-action="toggle-archived">${state.showArchivedLots?'Hide':'View'} previous lots${archived.length?` (${archived.length})`:''}</button>
        </div>
      </div>

      <h3 style="margin-top:1rem">Shared QC targets</h3>
      <table class="target-table">
        <thead><tr><th>Analyte</th><th>Level</th><th>Mean</th><th>SD</th><th>&minus;2SD</th><th>+2SD</th></tr></thead>
        <tbody>${targetRows}</tbody>
      </table>
      <p class="muted" style="font-size:.78rem;margin-top:.5rem">Entered once and used by all ${insts.length} EasyLyte Plus analyzers. Each analyzer still keeps its own results and its own Westgard evaluation.</p>

      ${state.showArchivedLots ? `
        <h3 style="margin-top:1.1rem">Previous lots</h3>
        ${archived.length ? archived.map(function (l) {
          return `<div class="archived-lot">
            <strong>${esc(l.level1.lot||l.level2.lot||'(no lot number)')}</strong> &mdash; ${esc(l.controlName)}<br>
            <span class="muted">L1 exp ${esc(fmtDate(l.level1.expiry))} &middot; L2 exp ${esc(fmtDate(l.level2.expiry))} &middot; archived ${esc(fmtDate(l.archivedAt||l.createdAt))}</span><br>
            <span class="muted">${ELECTROLYTE_ANALYTES.map(function (an) {
              const t1 = l.analytes[an] && l.analytes[an].level1, t2 = l.analytes[an] && l.analytes[an].level2;
              return `${esc(an)}: L1 ${t1?fmtNum(t1.mean)+'/'+fmtNum(t1.sd):'—'}, L2 ${t2?fmtNum(t2.mean)+'/'+fmtNum(t2.sd):'—'}`;
            }).join(' &nbsp;|&nbsp; ')}</span>
          </div>`;
        }).join('') : `<p class="empty-hint">No previous lots yet.</p>`}
      ` : ''}
    </div>`;
}

/* Editor works on a draft copy — nothing is written until Save & Apply. */
function renderProfileEditor() {
  const ed = state.editingProfile;
  const d = ed.draft;
  const isNew = ed.mode === 'new';

  const levelCards = [1,2].map(function (lv) {
    const key = 'level'+lv;
    return `
      <div class="editor-level">
        <h3>Level ${lv}</h3>
        <label>Lot number <input type="text" data-action="draft-field" data-path="${key}.lot" value="${esc(d[key].lot||'')}"></label>
        <label>Expiry date <input type="date" data-action="draft-field" data-path="${key}.expiry" value="${esc(d[key].expiry||'')}"></label>
      </div>`;
  }).join('');

  const targetRows = ELECTROLYTE_ANALYTES.map(function (an, ai) {
    return [1,2].map(function (lv) {
      const key = 'level'+lv;
      const t = (d.analytes[an] && d.analytes[an][key]) || { mean:'', sd:'' };
      const meanVal = (t.mean===''||t.mean==null) ? '' : t.mean;
      const sdVal = (t.sd===''||t.sd==null) ? '' : t.sd;
      const m = num(meanVal), s = num(sdVal);
      const ok = m!=null && s!=null && s>0;
      return `<tr>
        <td>${esc(an)}</td><td class="num">L${lv}</td>
        <td><input type="number" step="any" data-action="draft-target" data-analyte="${esc(an)}" data-level="${key}" data-field="mean" value="${esc(meanVal)}"></td>
        <td><input type="number" step="any" data-action="draft-target" data-analyte="${esc(an)}" data-level="${key}" data-field="sd" value="${esc(sdVal)}"></td>
        <td class="calc" id="calc-${ai}-${lv}-lo">${ok?fmtNum(m-2*s):'—'}</td>
        <td class="calc" id="calc-${ai}-${lv}-hi">${ok?fmtNum(m+2*s):'—'}</td>
      </tr>`;
    }).join('');
  }).join('');

  const insts = getElectrolyteInstruments();

  return `
    <div class="settings-card accent">
      <div class="editor-head">
        <h2 style="margin:0">${isNew?'Create new control lot':'Edit electrolyte control configuration'}</h2>
        <span class="unsaved-badge" id="unsaved-badge" style="${ed.dirty?'':'display:none'}">Unsaved changes</span>
      </div>
      <p class="muted">${isNew
        ? 'The current lot is kept and archived. Results already recorded keep the mean/SD of the lot they were run under.'
        : 'Values are applied to all EasyLyte Plus analyzers when you press Save &amp; Apply. Nothing is saved while you type.'}</p>
      ${ed.errors && ed.errors.length ? `<div class="errorbox"><strong>Fix before saving:</strong><ul>${ed.errors.map(function (e) { return `<li>${esc(e)}</li>`; }).join('')}</ul></div>` : ''}

      <label style="max-width:320px">Control name <input type="text" data-action="draft-field" data-path="controlName" value="${esc(d.controlName||'')}"></label>
      <div class="editor-levels">${levelCards}</div>
      <p class="muted" style="font-size:.78rem;margin-top:-.5rem">Level 1 and Level 2 can carry different lot numbers and expiry dates.</p>

      <h3>QC targets</h3>
      <table class="target-table">
        <thead><tr><th>Analyte</th><th>Level</th><th>Mean</th><th>SD</th><th>&minus;2SD</th><th>+2SD</th></tr></thead>
        <tbody>${targetRows}</tbody>
      </table>
      <p class="muted" style="font-size:.78rem">&plusmn;1SD, &plusmn;2SD and &plusmn;3SD chart lines are calculated from Mean and SD. Leave both boxes blank for an analyte you have not set up yet.</p>

      <div class="editor-actions">
        <button class="primary" data-action="save-profile">Save &amp; apply to all ${insts.length} EasyLyte analyzers</button>
        <button data-action="cancel-profile">Cancel</button>
      </div>
    </div>`;
}

function renderInstrumentSettings(inst) {
  const shared = inst.sharedProfile === 'electrolyte';
  const assayBlocks = inst.assays.map(function (assay, ai) {
    const levelRows = assay.levels.map(function (lvl) {
      const a = getApplicableQCSettings(inst, assay.name, lvl);
      const sortedPoints = lvl.points.slice().sort(function (x,y) { return String(x.datetime).localeCompare(String(y.datetime)); });
      const pointRows = sortedPoints.length ? sortedPoints.map(function (p) {
        const voided = p.status === 'voided';
        return `<tr class="${voided?'voided':''}">
          <td class="num">${fmtDateTime(p.datetime)}</td>
          <td class="num">${p.value}</td>
          <td>${esc(p.operator||'')}</td>
          <td class="reason">${voided?`voided — ${esc(p.voidReason||'no reason given')}`:''}</td>
          <td>${voided?'':`<button class="small danger" data-action="void-point" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}" data-point-id="${p.id}">Remove</button>`}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="5" class="muted">No results yet.</td></tr>`;

      /* Shared instruments do not repeat control/lot/mean/SD entry. */
      const settingsFields = shared
        ? `<span class="muted" style="font-size:.78rem">Using shared Electrolyte Control configuration &mdash; ${esc(a.controlName||'—')}, lot ${esc(a.lot||'—')}, mean ${fmtNum(a.mean)}, SD ${fmtNum(a.sd)}${a.source==='override'?' <span class="pill pill-override">Instrument override</span>':''}</span>
           ${inst.overrideEnabled ? `
             <label>Override mean <input type="number" step="any" value="${esc(getOverrideVal(inst, assay.name, lvl.level, 'mean'))}" data-action="update-override" data-instrument="${inst.id}" data-assay-name="${esc(assay.name)}" data-level="${lvl.level}" data-field="mean"></label>
             <label>Override SD <input type="number" step="any" value="${esc(getOverrideVal(inst, assay.name, lvl.level, 'sd'))}" data-action="update-override" data-instrument="${inst.id}" data-assay-name="${esc(assay.name)}" data-level="${lvl.level}" data-field="sd"></label>` : ''}`
        : `<label>Control <input type="text" value="${esc(lvl.controlName||'')}" data-action="update-level-field" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}" data-field="controlName"></label>
           <label>Lot <input type="text" value="${esc(lvl.controlLot||'')}" data-action="update-level-field" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}" data-field="controlLot"></label>
           <label>Exp. <input type="date" value="${esc(lvl.expDate||'')}" data-action="update-level-field" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}" data-field="expDate"></label>
           <label>Mean <input type="number" step="any" value="${esc(lvl.mean)}" data-action="update-level-field" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}" data-field="mean"></label>
           <label>SD <input type="number" step="any" value="${esc(lvl.sd)}" data-action="update-level-field" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}" data-field="sd"></label>`;

      return `
        <div class="level-settings-row">
          <span>L${lvl.level}</span>
          ${settingsFields}
          <span class="muted">${lvl.points.filter(function (p) { return p.status!=='voided'; }).length} results</span>
          <button class="small" data-action="csv-export-level" data-instrument="${inst.id}" data-assay="${ai}" data-level="${lvl.level}">CSV</button>
        </div>
        <div class="points-table-wrap"><table class="points-table"><thead><tr><th>Date/time</th><th>Value</th><th>Op.</th><th></th><th></th></tr></thead><tbody>${pointRows}</tbody></table></div>`;
    }).join('');

    return `
      <div class="assay-settings">
        <div class="assay-settings-head">
          <input type="text" value="${esc(assay.name)}" data-action="update-assay-field" data-instrument="${inst.id}" data-assay="${ai}" data-field="name">
          <input type="text" value="${esc(assay.unit||'')}" placeholder="unit" data-action="update-assay-field" data-instrument="${inst.id}" data-assay="${ai}" data-field="unit">
          <button class="small danger" data-action="remove-assay" data-instrument="${inst.id}" data-assay="${ai}">Remove assay</button>
        </div>
        ${levelRows}
      </div>`;
  }).join('');

  return `
    <div class="instrument-settings">
      <div class="instrument-settings-head">
        <input type="text" value="${esc(inst.name)}" data-action="update-instrument-field" data-instrument="${inst.id}" data-field="name">
        <input type="text" value="${esc(inst.serial)}" data-action="update-instrument-field" data-instrument="${inst.id}" data-field="serial">
        <button class="small danger" data-action="remove-instrument" data-instrument="${inst.id}">Remove instrument</button>
      </div>
      <div class="shared-note">
        <label class="rule-toggle"><input type="checkbox" data-action="toggle-shared" data-instrument="${inst.id}" ${shared?'checked':''}> Uses shared Electrolyte Control configuration</label>
        ${shared ? `<label class="rule-toggle"><input type="checkbox" data-action="toggle-override" data-instrument="${inst.id}" ${inst.overrideEnabled?'checked':''}> Use instrument-specific Mean/SD override</label>` : ''}
      </div>
      ${assayBlocks}
      <form class="add-assay-form no-print" data-action="add-assay" data-instrument="${inst.id}">
        <input type="text" name="name" placeholder="New assay name" required>
        <input type="text" name="unit" placeholder="unit">
        <button type="submit">Add assay</button>
      </form>
    </div>`;
}

function getOverrideVal(inst, assayName, levelNum, field) {
  const o = inst.overrides && inst.overrides[assayName] && inst.overrides[assayName]['level'+levelNum];
  return (o && o[field] != null) ? o[field] : '';
}

/* ---------- print report (all three EasyLyte analyzers, date range) ---------- */
function renderPrintReport() {
  const from = state.reportFrom || '', to = state.reportTo || '';
  const insts = getElectrolyteInstruments();
  const inRange = function (dt) {
    const d = String(dt).slice(0,10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  };
  const body = insts.map(function (inst) {
    const assayBlocks = inst.assays.map(function (assay, ai) {
      const levels = getEvaluatedAssay(inst, ai).map(function (lvl) {
        const a = lvl.applicable;
        const pts = lvl.points.filter(function (p) { return inRange(p.datetime); });
        if (!pts.length) return '';
        const configured = isFinite(a.mean) && a.sd > 0;
        const key = inst.id + '|' + ai + '|' + lvl.level;
        const viol = pts.filter(function (p) { return p.flags.length; });
        return `
          <div class="level-panel">
            <div class="level-info">
              <div class="li-row"><span>Assay</span><strong>${esc(assay.name)}</strong></div>
              <div class="li-row"><span>Level</span><strong>${lvl.level}</strong></div>
              <div class="li-row"><span>Control</span><strong>${esc(a.controlName||'—')}</strong></div>
              <div class="li-row"><span>Lot</span><strong>${esc(a.lot||'—')}</strong></div>
              <div class="li-row"><span>Exp.</span><strong>${esc(a.expiry?fmtDate(a.expiry):'—')}</strong></div>
              <div class="li-row"><span>N</span><strong class="num">${pts.length}</strong></div>
              <div class="li-row"><span>Mean</span><strong class="num">${fmtNum(a.mean)}</strong></div>
              <div class="li-row"><span>SD</span><strong class="num">${fmtNum(a.sd)}</strong></div>
              <div class="li-row"><span>Range (&plusmn;2SD)</span><strong class="num">${configured?fmtNum(a.mean-2*a.sd)+'–'+fmtNum(a.mean+2*a.sd):'—'}</strong></div>
            </div>
            <div class="level-chart">
              ${configured ? buildChartSVG(key, 0, pts.slice(-40), null) : '<div class="empty-chart">No target configured</div>'}
              ${viol.length ? `<div class="violation-mini"><strong>${viol.length} flagged result${viol.length===1?'':'s'}</strong><ul>${viol.map(function (v) {
                return `<li>${fmtDateTime(v.datetime)} — ${v.value} — ${v.flags.map(function (f) { return esc(f.rule); }).join(', ')}${v.correctiveAction?' — action: '+esc(v.correctiveAction):''}</li>`;
              }).join('')}</ul></div>` : ''}
            </div>
          </div>`;
      }).join('');
      return levels;
    }).join('');
    if (!assayBlocks.trim()) return '';
    return `<h2 style="margin-top:1rem">${esc(inst.name)} — S/N ${esc(inst.serial)}</h2>${assayBlocks}`;
  }).join('');

  const rangeLabel = (from||to) ? `${from?fmtDate(from):'start'} to ${to?fmtDate(to):'today'}` : 'all recorded results';
  return `
    <section>
      ${printHeader('Electrolyte QC Report — EasyLyte Plus analyzers', 'Date range: ' + rangeLabel)}
      <div class="no-print" style="margin-bottom:1rem">
        <h1>Electrolyte QC report</h1>
        <p class="muted">Date range: ${esc(rangeLabel)}. Use your browser's print dialog, then close this view.</p>
        <button data-action="print-view">Print again</button>
        <button data-action="set-view" data-view="settings">Back to settings</button>
      </div>
      ${body || '<p class="empty-hint">No results in this date range.</p>'}
    </section>`;
}

/* ---------- validation ---------- */
function validateControlProfile(d) {
  const errors = [];
  if (!String(d.controlName||'').trim()) errors.push('Control name is required.');
  [1,2].forEach(function (lv) {
    const key = 'level'+lv, L = d[key] || {};
    if (L.lot != null && L.lot !== '' && !String(L.lot).trim()) errors.push(`Level ${lv} lot number cannot be only spaces.`);
    if (L.expiry && !isValidDateStr(L.expiry)) errors.push(`Level ${lv} expiry date is not a valid date.`);
  });
  ELECTROLYTE_ANALYTES.forEach(function (an) {
    [1,2].forEach(function (lv) {
      const key = 'level'+lv;
      const t = (d.analytes[an] && d.analytes[an][key]) || {};
      const meanRaw = (t.mean===''||t.mean==null) ? '' : String(t.mean);
      const sdRaw = (t.sd===''||t.sd==null) ? '' : String(t.sd);
      if (meanRaw === '' && sdRaw === '') return;   // not configured yet — allowed
      const m = num(meanRaw), s = num(sdRaw);
      if (m === null) errors.push(`${an} L${lv}: mean must be a number.`);
      if (s === null) errors.push(`${an} L${lv}: SD must be a number.`);
      else if (!(s > 0)) errors.push(`${an} L${lv}: SD must be greater than 0.`);
    });
  });
  return errors;
}

/* ---------- shared profile editing ---------- */
function blankDraftFrom(lot) {
  const d = lot ? deepCopy(lot) : {
    controlName:'', level1:{lot:'',expiry:''}, level2:{lot:'',expiry:''}, analytes:{}
  };
  if (!d.analytes) d.analytes = {};
  ELECTROLYTE_ANALYTES.forEach(function (an) {
    if (!d.analytes[an]) d.analytes[an] = {};
    [1,2].forEach(function (lv) {
      const key = 'level'+lv;
      if (!d.analytes[an][key]) d.analytes[an][key] = { mean:'', sd:'' };
    });
  });
  if (!d.level1) d.level1 = { lot:'', expiry:'' };
  if (!d.level2) d.level2 = { lot:'', expiry:'' };
  return d;
}
function startEditProfile(profileId, mode) {
  const lot = getActiveControlLot(profileId);
  state.editingProfile = { profileId: profileId, mode: mode, draft: blankDraftFrom(lot), dirty: false, errors: [] };
  if (mode === 'new') {
    /* Start from current targets but force a fresh lot number entry. */
    state.editingProfile.draft.level1.lot = '';
    state.editingProfile.draft.level2.lot = '';
  }
  render();
}
function setDraftPath(path, value) {
  const ed = state.editingProfile;
  if (!ed) return;
  const parts = path.split('.');
  let o = ed.draft;
  for (let i=0; i<parts.length-1; i++) o = o[parts[i]];
  o[parts[parts.length-1]] = value;
  ed.dirty = true;
}

/* Apply a draft to the shared profile.
   mode 'edit'  -> corrects the ACTIVE lot in place (and the snapshots of
                   results already recorded under that same lot).
   mode 'new'   -> archives the current lot and starts a new one; existing
                   results keep their original lot, mean and SD. */
function applySharedElectrolyteProfile(profileId, draft, mode) {
  const profile = getSharedControlProfile(profileId);
  if (!profile) return 0;

  const cleanAnalytes = {};
  ELECTROLYTE_ANALYTES.forEach(function (an) {
    cleanAnalytes[an] = {};
    [1,2].forEach(function (lv) {
      const key = 'level'+lv;
      const t = (draft.analytes[an] && draft.analytes[an][key]) || {};
      const m = num(t.mean), s = num(t.sd);
      cleanAnalytes[an][key] = (m!=null && s!=null && s>0) ? { mean:m, sd:s } : { mean:0, sd:0 };
    });
  });

  if (mode === 'new') {
    const prev = getActiveControlLot(profileId);
    if (prev) prev.archivedAt = nowISO();
    const newLot = {
      id: 'lot-' + uid(),
      controlName: String(draft.controlName||'').trim(),
      level1: { lot: String(draft.level1.lot||'').trim(), expiry: draft.level1.expiry||'' },
      level2: { lot: String(draft.level2.lot||'').trim(), expiry: draft.level2.expiry||'' },
      analytes: cleanAnalytes,
      createdAt: nowISO(), archivedAt: null, note: ''
    };
    profile.lots.push(newLot);
    profile.activeLotId = newLot.id;
    logChange('new-lot', `New electrolyte control lot activated (L1 ${newLot.level1.lot||'—'} / L2 ${newLot.level2.lot||'—'}). Previous lot archived; existing results keep their original targets.`);
    return getElectrolyteInstruments().length;
  }

  const lot = getActiveControlLot(profileId);
  if (!lot) return 0;
  lot.controlName = String(draft.controlName||'').trim();
  lot.level1 = { lot: String(draft.level1.lot||'').trim(), expiry: draft.level1.expiry||'' };
  lot.level2 = { lot: String(draft.level2.lot||'').trim(), expiry: draft.level2.expiry||'' };
  lot.analytes = cleanAnalytes;

  /* A correction to the active lot also corrects results recorded under it. */
  getElectrolyteInstruments().forEach(function (inst) {
    inst.assays.forEach(function (assay) {
      assay.levels.forEach(function (lvl) {
        const key = 'level'+lvl.level;
        const t = cleanAnalytes[assay.name] && cleanAnalytes[assay.name][key];
        lvl.points.forEach(function (p) {
          if (p.lotId === lot.id && t && t.sd > 0) {
            p.mean = t.mean; p.sd = t.sd; p.lotLabel = lot[key].lot;
          }
        });
      });
    });
  });
  logChange('edit-profile', `Electrolyte control configuration updated and applied to ${getElectrolyteInstruments().length} EasyLyte analyzers.`);
  return getElectrolyteInstruments().length;
}

function saveProfile() {
  const ed = state.editingProfile;
  if (!ed) return;
  const errors = validateControlProfile(ed.draft);
  if (errors.length) { ed.errors = errors; render(); return; }
  const count = applySharedElectrolyteProfile(ed.profileId, ed.draft, ed.mode);
  state.editingProfile = null;
  flash(`Electrolyte control settings applied to ${count} EasyLyte Plus analyzer${count===1?'':'s'}.`);
  renderAndSave();
}

/* ---------- result entry / correction ---------- */
function addResult(instId, assayIndex, levelNum, datetime, value, operator) {
  const inst = getInstrument(instId);
  if (!inst) return false;
  const assay = inst.assays[assayIndex];
  const lvl = assay.levels.find(function (l) { return l.level === levelNum; });
  if (!lvl) return false;
  const a = getApplicableQCSettings(inst, assay.name, lvl);
  lvl.points.push(makePoint({
    datetime: datetime, value: value, operator: operator,
    profileId: a.profileId, lotId: a.lotId, lotLabel: a.lot,
    mean: a.mean, sd: a.sd
  }));
  return true;
}

function voidPoint(instId, assayIdx, levelNum, pointId) {
  const inst = getInstrument(instId);
  const assay = inst.assays[assayIdx];
  const lvl = assay.levels.find(function (l) { return l.level === levelNum; });
  const p = lvl.points.find(function (x) { return x.id === pointId; });
  if (!p) return;
  const reason = window.prompt(
    'Reason for removing this QC result (required).\nExamples: transcription error, wrong control level, duplicate entry, incorrect analyzer selected, other.',
    ''
  );
  if (reason === null) return;
  if (!String(reason).trim()) { alert('A reason is required to remove a QC result.'); return; }
  p.status = 'voided';
  p.voidReason = String(reason).trim();
  p.voidedAt = nowISO();
  logChange('void-result', `${inst.name} (${inst.serial}) ${assay.name} L${levelNum} — result ${p.value} of ${fmtDateTime(p.datetime)} removed. Reason: ${p.voidReason}`);
  state.selected = null;
  flash('QC result removed from charts and rule evaluation. The original value and your reason are kept in the record.');
  renderAndSave();
}

function removeInstrument(instId) {
  const inst = getInstrument(instId);
  const label = inst ? `${inst.name} (${inst.serial})` : 'this instrument';
  if (!confirm(`Remove ${label} and all its QC data? This cannot be undone.`)) return;
  state.data.instruments = state.data.instruments.filter(function (i) { return i.id !== instId; });
  if (state.activeInstrumentId === instId) state.activeInstrumentId = null;
  logChange('remove-instrument', `Instrument removed: ${label}`);
  renderAndSave();
}
function removeAssay(instId, assayIdx) {
  if (!confirm('Remove this assay and all its QC data? This cannot be undone.')) return;
  const inst = getInstrument(instId);
  const name = inst.assays[assayIdx] ? inst.assays[assayIdx].name : '';
  inst.assays.splice(assayIdx,1);
  state.activeAssayIndex = 0;
  logChange('remove-assay', `Assay removed: ${name} on ${inst.name} (${inst.serial})`);
  renderAndSave();
}
function clearAllResults() {
  if (!confirm('This removes every QC result from every instrument but keeps your instruments, assays and control configuration. Export a backup first if you want to keep the results. Continue?')) return;
  state.data.instruments.forEach(function (inst) {
    inst.assays.forEach(function (assay) { assay.levels.forEach(function (lvl) { lvl.points = []; }); });
  });
  state.selected = null;
  logChange('clear-results', 'All QC results cleared by user.');
  flash('All QC results cleared.');
  renderAndSave();
}

function stepPoint(dir) {
  if (!state.selected) return;
  const parts = state.selected.key.split('|');
  const inst = getInstrument(parts[0]);
  if (!inst) return;
  const evalLevels = getEvaluatedAssay(inst, parseInt(parts[1],10));
  const lvl = evalLevels.find(function (l) { return String(l.level) === parts[2]; });
  if (!lvl) return;
  let ni = state.selected.pointIndex + dir;
  ni = Math.max(0, Math.min(lvl.points.length-1, ni));
  state.selected.pointIndex = ni;
  state.noteEditor = null;
  render();
}

/* ---------- batch save ---------- */
function saveBatch() {
  const draft = ensureBatchDraft();
  if (!draft.datetime) { alert('Choose a date and time for this QC run.'); return; }
  const bad = [];
  const toAdd = [];
  Object.keys(draft.values).forEach(function (k) {
    const raw = draft.values[k];
    if (raw === '' || raw == null) return;
    const v = num(raw);
    const parts = k.split('||');
    if (v === null) { bad.push(parts[1] + ' L' + parts[2]); return; }
    toAdd.push({ instId: parts[0], assayName: parts[1], level: parseInt(parts[2],10), value: v });
  });
  if (bad.length) { alert('These entries are not valid numbers: ' + bad.join(', ')); return; }
  if (!toAdd.length) { alert('No values entered.'); return; }

  let saved = 0;
  const touched = {};
  toAdd.forEach(function (item) {
    const inst = getInstrument(item.instId);
    if (!inst) return;
    const ai = inst.assays.findIndex(function (a) { return a.name === item.assayName; });
    if (ai < 0) return;
    if (addResult(item.instId, ai, item.level, draft.datetime, item.value, draft.operator)) {
      saved++; touched[inst.serial] = true;
    }
  });
  logChange('batch-entry', `QC run ${fmtDateTime(draft.datetime)} — ${saved} result(s) entered across ${Object.keys(touched).length} analyzer(s)${draft.operator?' by '+draft.operator:''}.`);
  state.batchDraft = { datetime: draft.datetime, operator: draft.operator, values: {} };
  flash(`${saved} result${saved===1?'':'s'} saved across ${Object.keys(touched).length} analyzer${Object.keys(touched).length===1?'':'s'}. Westgard rules were evaluated separately for each.`);
  renderAndSave();
}

/* ---------- exports ---------- */
function exportJSON() {
  state.data.schemaVersion = 2;
  downloadBlob(JSON.stringify(state.data, null, 2), `mmc-qc-data-${todayStr()}.json`, 'application/json');
}
function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed || !Array.isArray(parsed.instruments)) throw new Error('This file does not look like QC dashboard data (no instrument list found).');
      const wasOld = parsed.schemaVersion !== 2;
      state.data = migrateData(parsed);
      state.selected = null; state.activeInstrumentId = null; state.editingProfile = null;
      flash(wasOld ? 'Backup imported and upgraded to the current format. All QC results preserved.' : 'Backup imported.');
      renderAndSave();
    } catch (err) {
      alert('Could not import this file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

const FULL_CSV_HEADER = ['Institution','Department','Instrument','Serial No','Assay','Unit','Level','Date/Time',
  'QC Value','Control Name','Control Lot','Expiry','Mean','SD','Z-Score','Westgard Flags','Severity',
  'Operator','Comment','Corrective Action','Status','Record Status','Removal Reason'];

function buildResultRows(filterFn) {
  const rows = [];
  state.data.instruments.forEach(function (inst) {
    inst.assays.forEach(function (assay, ai) {
      const evalLevels = getEvaluatedAssay(inst, ai);
      evalLevels.forEach(function (lvl) {
        const a = lvl.applicable;
        lvl.points.forEach(function (p) {
          if (filterFn && !filterFn(inst, assay, lvl, p)) return;
          rows.push([
            state.data.institution, state.data.department, inst.name, inst.serial, assay.name, assay.unit||'',
            'L'+lvl.level, p.datetime, p.value, a.controlName||'', p.lotLabel||a.lot||'', a.expiry||'',
            p.appliedMean!=null?p.appliedMean:'', p.appliedSd!=null?p.appliedSd:'',
            p.z!=null?p.z.toFixed(3):'',
            p.flags.map(function (f) { return f.rule; }).join(' '),
            p.flags.length?worstSeverity(p.flags):'', p.operator||'', p.comment||'', p.correctiveAction||'',
            p.resolution||'', 'active', ''
          ]);
        });
      });
      /* Voided results are excluded from charts and rule evaluation, but are
         retained in exports (with reason) so the record stays traceable. */
      assay.levels.forEach(function (lvl) {
        lvl.points.filter(function (p) { return p.status === 'voided'; }).forEach(function (p) {
          if (filterFn && !filterFn(inst, assay, lvl, p)) return;
          rows.push([
            state.data.institution, state.data.department, inst.name, inst.serial, assay.name, assay.unit||'',
            'L'+lvl.level, p.datetime, p.value, '', p.lotLabel||'', '',
            p.mean!=null?p.mean:'', p.sd!=null?p.sd:'', '', '', '',
            p.operator||'', p.comment||'', p.correctiveAction||'', p.resolution||'', 'voided', p.voidReason||''
          ]);
        });
      });
    });
  });
  return rows;
}
function rowsToCSV(header, rows) {
  return [header.map(csvCell).join(',')].concat(rows.map(function (r) { return r.map(csvCell).join(','); })).join('\n');
}
function exportFullCSV() {
  downloadBlob(rowsToCSV(FULL_CSV_HEADER, buildResultRows(null)), `mmc-qc-all-results-${todayStr()}.csv`, 'text/csv');
}
function exportElectrolyteReport() {
  const from = state.reportFrom || '', to = state.reportTo || '';
  const rows = buildResultRows(function (inst, assay, lvl, p) {
    if (inst.sharedProfile !== 'electrolyte') return false;
    const d = String(p.datetime).slice(0,10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });
  if (!rows.length) { alert('No electrolyte results in that date range.'); return; }
  downloadBlob(rowsToCSV(FULL_CSV_HEADER, rows), `mmc-electrolyte-qc-${from||'start'}_to_${to||todayStr()}.csv`, 'text/csv');
}
function exportViolationsCSV() {
  const header = ['Date/Time','Instrument','Serial No','Assay','Level','QC Value','Control','Lot','Mean','SD','Z-Score','Rule','Severity','Operator','Comment','Corrective Action','Status'];
  const rows = collectViolations().map(function (r) {
    return [r.date, r.instrument, r.serial, r.assay, 'L'+r.level, r.value, r.controlName||'', r.lot||'',
            r.mean!=null?r.mean:'', r.sd!=null?r.sd:'', r.z!=null?r.z.toFixed(3):'', r.rule, r.severity,
            r.operator||'', r.comment||'', r.correctiveAction||'', r.resolution||'Open'];
  });
  if (!rows.length) { alert('No violations to export.'); return; }
  downloadBlob(rowsToCSV(header, rows), `mmc-qc-violations-${todayStr()}.csv`, 'text/csv');
}
function csvExportLevel(instId, assayIdx, levelNum) {
  const inst = getInstrument(instId);
  const assay = inst.assays[assayIdx];
  const rows = buildResultRows(function (i, a, l) {
    return i.id === instId && a.name === assay.name && l.level === levelNum;
  });
  downloadBlob(rowsToCSV(FULL_CSV_HEADER, rows),
    `${safeFilename(inst.serial)}_${safeFilename(assay.name)}_L${levelNum}_${todayStr()}.csv`, 'text/csv');
}

/* ---------- event delegation ---------- */
function onAppClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  if (a==='set-view') { state.view = el.dataset.view; state.expandedViolation=null; render(); }
  else if (a==='open-instrument' || a==='select-instrument') {
    state.activeInstrumentId = el.dataset.instrument;
    if (a==='open-instrument') state.view='instrument';
    state.activeAssayIndex = 0; state.selected = null; state.noteEditor = null; render();
  }
  else if (a==='select-assay') { state.activeAssayIndex = parseInt(el.dataset.assay,10); state.selected=null; state.noteEditor=null; render(); }
  else if (a==='select-point') { state.selected = { key: el.dataset.key, pointIndex: parseInt(el.dataset.pointIndex,10) }; state.noteEditor=null; render(); }
  else if (a==='step-point') { stepPoint(parseInt(el.dataset.dir,10)); }
  else if (a==='open-note') { state.noteEditor = { key: el.dataset.key, pointId: el.dataset.pointId }; render(); }
  else if (a==='cancel-note') { state.noteEditor = null; render(); }
  else if (a==='export-json') { exportJSON(); }
  else if (a==='trigger-import') { const f = document.getElementById('import-file'); if (f) f.click(); }
  else if (a==='print-view') { window.print(); }
  else if (a==='export-full-csv') { exportFullCSV(); }
  else if (a==='export-violations-csv') { exportViolationsCSV(); }
  else if (a==='export-electrolyte-report') { exportElectrolyteReport(); }
  else if (a==='print-electrolyte-report') { state.view='printreport'; render(); setTimeout(function () { window.print(); }, 120); }
  else if (a==='csv-export-level') { csvExportLevel(el.dataset.instrument, parseInt(el.dataset.assay,10), parseInt(el.dataset.level,10)); }
  else if (a==='void-point') { voidPoint(el.dataset.instrument, parseInt(el.dataset.assay,10), parseInt(el.dataset.level,10), el.dataset.pointId); }
  else if (a==='remove-instrument') { removeInstrument(el.dataset.instrument); }
  else if (a==='remove-assay') { removeAssay(el.dataset.instrument, parseInt(el.dataset.assay,10)); }
  else if (a==='clear-all-results') { clearAllResults(); }
  else if (a==='toggle-sort-violations') { state.violationSort = state.violationSort==='asc'?'desc':'asc'; render(); }
  else if (a==='toggle-violation') { const k = el.dataset.vkey; state.expandedViolation = (state.expandedViolation===k)?null:k; render(); }
  else if (a==='goto-violation') {
    const instId = el.dataset.instrument, ai = parseInt(el.dataset.assay,10);
    const levelNum = parseInt(el.dataset.level,10), pid = el.dataset.pointId;
    const inst = getInstrument(instId);
    if (inst) {
      const lvl = getEvaluatedAssay(inst, ai).find(function (l) { return l.level === levelNum; });
      const idx = lvl ? lvl.points.findIndex(function (p) { return p.id === pid; }) : -1;
      state.view='instrument'; state.activeInstrumentId=instId; state.activeAssayIndex=ai;
      state.selected = idx>=0 ? { key: instId+'|'+ai+'|'+levelNum, pointIndex: idx } : null;
      state.noteEditor = null; render();
    }
  }
  else if (a==='edit-profile') { startEditProfile(el.dataset.profile, 'edit'); }
  else if (a==='new-lot') { startEditProfile(el.dataset.profile, 'new'); }
  else if (a==='save-profile') { saveProfile(); }
  else if (a==='cancel-profile') {
    if (state.editingProfile && state.editingProfile.dirty && !confirm('Discard unsaved changes to the control configuration?')) return;
    state.editingProfile = null; render();
  }
  else if (a==='toggle-archived') { state.showArchivedLots = !state.showArchivedLots; render(); }
  else if (a==='save-batch') { saveBatch(); }
  else if (a==='clear-batch') { state.batchDraft = { datetime: nowLocalInputValue(), operator:'', values:{} }; render(); }
}

function onAppInput(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  /* Draft edits update in memory only — no save, no re-render, focus preserved. */
  if (a === 'draft-field') { setDraftPath(el.dataset.path, el.value); markDirty(); }
  else if (a === 'draft-target') {
    const ed = state.editingProfile; if (!ed) return;
    const an = el.dataset.analyte, lv = el.dataset.level, f = el.dataset.field;
    if (!ed.draft.analytes[an]) ed.draft.analytes[an] = {};
    if (!ed.draft.analytes[an][lv]) ed.draft.analytes[an][lv] = { mean:'', sd:'' };
    ed.draft.analytes[an][lv][f] = el.value;
    ed.dirty = true; markDirty();
    updateCalcCells(an, lv);
  }
  else if (a === 'batch-input') { ensureBatchDraft().values[el.dataset.bkey] = el.value; }
  else if (a === 'batch-datetime') { ensureBatchDraft().datetime = el.value; }
  else if (a === 'batch-operator') { ensureBatchDraft().operator = el.value; }
}
function markDirty() {
  const b = document.getElementById('unsaved-badge');
  if (b) b.style.display = '';
}
function updateCalcCells(analyte, levelKey) {
  const ed = state.editingProfile; if (!ed) return;
  const ai = ELECTROLYTE_ANALYTES.indexOf(analyte);
  const lv = levelKey === 'level1' ? 1 : 2;
  const t = ed.draft.analytes[analyte][levelKey];
  const m = num(t.mean), s = num(t.sd);
  const ok = m!=null && s!=null && s>0;
  const lo = document.getElementById(`calc-${ai}-${lv}-lo`);
  const hi = document.getElementById(`calc-${ai}-${lv}-hi`);
  if (lo) lo.textContent = ok ? fmtNum(m-2*s) : '—';
  if (hi) hi.textContent = ok ? fmtNum(m+2*s) : '—';
}

function onAppChange(e) {
  const t = e.target;
  if (t.id === 'import-file') { handleImportFile(t.files[0]); return; }
  if (t.id === 'report-from') { state.reportFrom = t.value; return; }
  if (t.id === 'report-to') { state.reportTo = t.value; return; }

  let el = t.closest('[data-action="update-level-field"]');
  if (el) {
    const inst = getInstrument(el.dataset.instrument);
    const assay = inst.assays[parseInt(el.dataset.assay,10)];
    const lvl = assay.levels.find(function (l) { return l.level === parseInt(el.dataset.level,10); });
    const field = el.dataset.field;
    if (field === 'mean' || field === 'sd') {
      const v = num(el.value);
      if (v === null) { alert(`${field==='mean'?'Mean':'SD'} must be a number.`); render(); return; }
      if (field === 'sd' && !(v > 0)) { alert('SD must be greater than 0.'); render(); return; }
      lvl[field] = v;
    } else if (field === 'expDate') {
      if (el.value && !isValidDateStr(el.value)) { alert('Expiry must be a valid date.'); render(); return; }
      lvl[field] = el.value;
    } else {
      lvl[field] = el.value;
    }
    renderAndSave(); return;
  }
  el = t.closest('[data-action="update-override"]');
  if (el) {
    const inst = getInstrument(el.dataset.instrument);
    const an = el.dataset.assayName, lv = 'level'+el.dataset.level, f = el.dataset.field;
    if (!inst.overrides[an]) inst.overrides[an] = {};
    if (!inst.overrides[an][lv]) inst.overrides[an][lv] = {};
    if (el.value === '') { delete inst.overrides[an][lv][f]; }
    else {
      const v = num(el.value);
      if (v === null || (f === 'sd' && !(v > 0))) { alert(f==='sd' ? 'Override SD must be a number greater than 0.' : 'Override mean must be a number.'); render(); return; }
      inst.overrides[an][lv][f] = v;
    }
    logChange('override', `${inst.name} (${inst.serial}) ${an} L${el.dataset.level} ${f} override set.`);
    renderAndSave(); return;
  }
  el = t.closest('[data-action="update-assay-field"]');
  if (el) {
    const inst = getInstrument(el.dataset.instrument);
    inst.assays[parseInt(el.dataset.assay,10)][el.dataset.field] = el.value;
    renderAndSave(); return;
  }
  el = t.closest('[data-action="update-instrument-field"]');
  if (el) {
    const inst = getInstrument(el.dataset.instrument);
    inst[el.dataset.field] = el.value;
    renderAndSave(); return;
  }
  el = t.closest('[data-action="toggle-shared"]');
  if (el) {
    const inst = getInstrument(el.dataset.instrument);
    if (el.checked) { inst.sharedProfile = 'electrolyte'; }
    else {
      /* Copy the values currently in force onto the instrument so nothing is lost. */
      inst.assays.forEach(function (assay) {
        assay.levels.forEach(function (lvl) {
          const ap = getApplicableQCSettings(inst, assay.name, lvl);
          lvl.controlName = ap.controlName||''; lvl.controlLot = ap.lot||''; lvl.expDate = ap.expiry||'';
          if (isFinite(ap.mean)) lvl.mean = ap.mean;
          if (ap.sd > 0) lvl.sd = ap.sd;
        });
      });
      inst.sharedProfile = null; inst.overrideEnabled = false;
    }
    logChange('shared-link', `${inst.name} (${inst.serial}) ${el.checked?'linked to':'unlinked from'} the shared electrolyte configuration.`);
    renderAndSave(); return;
  }
  el = t.closest('[data-action="toggle-override"]');
  if (el) {
    const inst = getInstrument(el.dataset.instrument);
    inst.overrideEnabled = el.checked;
    renderAndSave(); return;
  }
  el = t.closest('[data-action="toggle-rule"]');
  if (el) { state.rules[el.dataset.rule] = el.checked; renderAndSave(); return; }
  el = t.closest('[data-action="set-rule-n"]');
  if (el) { state.rules.rNxN = parseInt(el.value,10); renderAndSave(); return; }
  el = t.closest('[data-action="filter-violations"]');
  if (el) { state.violationFilter = el.value; state.expandedViolation=null; render(); return; }
  el = t.closest('[data-action="filter-resolution"]');
  if (el) { state.resolutionFilter = el.value; state.expandedViolation=null; render(); return; }
}

function onAppSubmit(e) {
  const form = e.target;
  if (form.matches('[data-action="quick-add"]')) {
    e.preventDefault();
    const dt = form.elements['dt'].value;
    const v = num(form.elements['val'].value);
    if (!dt) { alert('Choose a date and time.'); return; }
    if (v === null) { alert('QC result must be a number.'); return; }
    addResult(form.dataset.instrument, parseInt(form.dataset.assay,10), parseInt(form.dataset.level,10), dt, v, form.elements['op'].value.trim());
    state.selected = null; state.noteEditor = null;
    renderAndSave();
  } else if (form.matches('[data-action="save-note"]')) {
    e.preventDefault();
    const inst = getInstrument(form.dataset.instrument);
    const assay = inst.assays[parseInt(form.dataset.assay,10)];
    const lvl = assay.levels.find(function (l) { return l.level === parseInt(form.dataset.level,10); });
    const p = lvl.points.find(function (x) { return x.id === form.dataset.pointId; });
    if (p) {
      p.comment = form.elements['comment'].value.trim();
      p.correctiveAction = form.elements['action'].value.trim();
      p.resolution = form.elements['resolution'].value;
      logChange('note', `${inst.name} (${inst.serial}) ${assay.name} L${lvl.level} ${fmtDateTime(p.datetime)} — note/corrective action recorded${p.resolution?' ('+p.resolution+')':''}.`);
    }
    state.noteEditor = null;
    renderAndSave();
  } else if (form.matches('[data-action="add-instrument"]')) {
    e.preventDefault();
    const name = form.elements['name'].value.trim(), serial = form.elements['serial'].value.trim();
    if (!name) return;
    state.data.instruments.push({ id: uid(), name: name, serial: serial, sharedProfile: null, overrideEnabled: false, overrides: {}, assays: [] });
    logChange('add-instrument', `Instrument added: ${name} (${serial})`);
    renderAndSave();
  } else if (form.matches('[data-action="add-assay"]')) {
    e.preventDefault();
    const inst = getInstrument(form.dataset.instrument);
    const name = form.elements['name'].value.trim(), unit = form.elements['unit'].value.trim();
    if (!name) return;
    inst.assays.push({ name: name, unit: unit, levels: [ makeLevel(1), makeLevel(2) ] });
    logChange('add-assay', `Assay added: ${name} on ${inst.name} (${inst.serial})`);
    renderAndSave();
  }
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', function () {
  loadState();
  saveState();                       // persist the migrated structure immediately
  const app = document.getElementById('app');
  app.addEventListener('click', onAppClick);
  app.addEventListener('change', onAppChange);
  app.addEventListener('input', onAppInput);
  app.addEventListener('submit', onAppSubmit);
  render();
});
</script>
</body>
</html>
