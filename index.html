<!DOCTYPE html>
<!-- MMC Pathology — QC Dashboard (schema v2). Single-file, no build step, no backend.
     Deploy by pushing to a GitHub repo and enabling Pages, or just open the file locally. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMC Pathology — QC Dashboard</title>
<style>
:root {
  --ink: #171B1E;
  --muted: #5B6670;
  --paper: #F3F5F4;
  --panel: #FFFFFF;
  --line: #D8DEDC;
  --brand: #0C6E62;
  --brand-deep: #084F46;
  --brand-tint: #E4EFED;
  --ok: #2E7D32;
  --ok-tint: #E5F3E3;
  --warning: #B8790E;
  --warning-tint: #FBF1D2;
  --reject: #B23A32;
  --reject-tint: #FBE1DD;
  --band-green: #DCEEDA;
  --band-yellow: #FBF0D0;
  --band-red: #F8DAD5;
  --band-outer: #E7E9EA;
  --grid-line: #C7CDCB;
  --line-color: #33474A;
  --point-normal: #1B2A3A;
  --select-outline: #0C6E62;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-num: "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size:15px; line-height:1.45; }
h1, h2, h3 { font-weight:600; letter-spacing:-0.01em; margin:0 0 .6rem; }
h1 { font-size:1.35rem; }
h2 { font-size:1.02rem; }
h3 { font-size:.9rem; }
p { margin: .3rem 0 .8rem; }
.muted { color: var(--muted); font-weight:400; }
.num, td.num, .li-row strong { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
a { color: var(--brand-deep); }

button { font-family: inherit; font-size:.83rem; cursor:pointer; border:1px solid var(--line); background: var(--panel); color: var(--ink); border-radius:5px; padding:.42rem .75rem; transition: background-color .12s ease, color .12s ease, border-color .12s ease; }
button:hover { border-color: var(--brand); color: var(--brand-deep); }
button.active { background: var(--brand); border-color: var(--brand); color:#fff; }
button.primary { background: var(--brand); border-color: var(--brand); color:#fff; }
button.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); color:#fff; }
button.danger { color: var(--reject); }
button.danger:hover { border-color: var(--reject); color: var(--reject); }
button.small { padding:.22rem .55rem; font-size:.75rem; }
button.link { border:none; background:none; padding:0; color: var(--brand-deep); text-decoration:underline; font-size:.78rem; }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family: inherit; font-size:.83rem; padding:.38rem .55rem; border:1px solid var(--line); border-radius:5px; background:#fff; color: var(--ink); }
textarea { resize:vertical; min-height:2.2rem; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset:1px; }
input.invalid { border-color: var(--reject); background: var(--reject-tint); }
label { font-size:.78rem; color: var(--muted); display:flex; flex-direction:column; gap:.2rem; }

.topbar { display:flex; align-items:center; gap:1.3rem; background: var(--brand); color:#fff; padding:.65rem 1.25rem; flex-wrap:wrap; }
.brand { font-weight:600; letter-spacing:-0.01em; white-space:nowrap; }
.tabs, .utility { display:flex; gap:.35rem; flex-wrap:wrap; }
.tabs button, .utility button { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); color:#fff; }
.tabs button:hover, .utility button:hover { background: rgba(255,255,255,.18); color:#fff; border-color:#fff; }
.tabs button.active { background:#fff; color: var(--brand-deep); border-color:#fff; }
.utility { margin-left:auto; }

main.view { padding: 1.3rem 1.5rem 3.5rem; max-width:1180px; margin:0 auto; }

.demo-note { background: var(--panel); border:1px solid var(--line); border-left:3px solid var(--brand); border-radius:4px; padding:.55rem .8rem; font-size:.83rem; }
.toast { background: var(--ok-tint); border:1px solid var(--ok); color:#1F5C22; border-radius:5px; padding:.5rem .85rem; font-size:.84rem; margin-bottom:1rem; }
.errorbox { background: var(--reject-tint); border:1px solid var(--reject); color:#7E2620; border-radius:5px; padding:.5rem .85rem; font-size:.82rem; margin:.5rem 0; }
.errorbox ul { margin:.25rem 0 0; padding-left:1.1rem; }

.section-head { display:flex; align-items:baseline; gap:.7rem; margin:1.6rem 0 .7rem; }
.section-head h2 { margin:0; }
.group-label { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color: var(--muted); font-weight:600; margin:1.3rem 0 .5rem; }
.group-label:first-child { margin-top:0; }

.inst-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:.9rem; }
.inst-card { display:flex; align-items:stretch; width:100%; text-align:left; border:1px solid var(--line); border-radius:6px; background: var(--panel); overflow:hidden; padding:0; font:inherit; color:inherit; }
.inst-card:hover { border-color: var(--brand); }
.inst-card-bar { display:block; width:6px; flex-shrink:0; }
.status-ok .inst-card-bar { background: var(--ok); }
.status-warning .inst-card-bar { background: var(--warning); }
.status-reject .inst-card-bar { background: var(--reject); }
.inst-card-body { display:flex; flex-direction:column; padding:.85rem 1rem; gap:.15rem; }
.inst-card-name { font-weight:600; }
.inst-card-serial { color: var(--muted); font-family: var(--font-num); font-size:.78rem; }
.inst-card-status { margin-top:.4rem; font-weight:600; font-size:.83rem; }
.status-ok .inst-card-status { color: var(--ok); }
.status-warning .inst-card-status { color: var(--warning); }
.status-reject .inst-card-status { color: var(--reject); }
.inst-card-count { color: var(--muted); font-size:.76rem; }

.inst-selector, .assay-tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.7rem; }
.chip { border-radius:999px; font-size:.8rem; }
.chip-serial { font-family: var(--font-num); opacity:.7; margin-left:.3rem; font-size:.75rem; }
.tab { border-radius:0; border:none; border-bottom:2px solid transparent; background:none; padding:.4rem .2rem; margin-right:.9rem; }
.tab:hover { border-color: var(--line); color: var(--brand-deep); }
.tab.active { color: var(--brand-deep); border-bottom-color: var(--brand); font-weight:600; }
.assay-title { margin-top:.2rem; margin-bottom:.25rem; }
.context-line { font-size:.79rem; color: var(--muted); margin:0 0 .8rem; font-family: var(--font-num); }
.context-line .sep { opacity:.45; margin:0 .45rem; }

.pill { display:inline-block; font-size:.7rem; font-weight:600; border-radius:3px; padding:.05rem .4rem; vertical-align:middle; }
.pill-ok { background: var(--ok-tint); color: var(--ok); }
.pill-soon { background: var(--warning-tint); color: var(--warning); }
.pill-expired { background: var(--reject-tint); color: var(--reject); }
.pill-override { background: var(--brand-tint); color: var(--brand-deep); }
.pill-shared { background: var(--band-outer); color: var(--muted); }

.level-panel { display:grid; grid-template-columns:190px 1fr; gap:1.1rem; border:1px solid var(--line); border-radius:6px; background: var(--panel); padding:1rem; margin-bottom:.55rem; }
.level-info { display:flex; flex-direction:column; gap:.4rem; border-right:1px solid var(--line); padding-right:1rem; }
.li-row { display:flex; justify-content:space-between; gap:.5rem; font-size:.79rem; }
.li-row span:first-child { color: var(--muted); }
.lj-svg { width:100%; height:auto; display:block; aspect-ratio: 900 / 220; }
.lj-axis-label { font-family: var(--font-num); font-size:9px; fill: var(--muted); }
.band-outer { fill: var(--band-outer); }
.band-red { fill: var(--band-red); }
.band-yellow { fill: var(--band-yellow); }
.band-green { fill: var(--band-green); }
.grid-line { stroke: var(--grid-line); stroke-width:1; }
.lot-divider { stroke: var(--brand-deep); stroke-width:1.2; stroke-dasharray:3 3; opacity:.7; }
.lot-divider-label { font-family: var(--font-num); font-size:8px; fill: var(--brand-deep); }
.lj-line { stroke: var(--line-color); stroke-width:1.4; fill:none; }
.lj-dot { stroke:#fff; stroke-width:1; cursor:pointer; }
.lj-hit { fill:transparent; cursor:pointer; }
.dot-normal { fill: var(--point-normal); }
.dot-warning { fill: var(--warning); }
.dot-reject { fill: var(--reject); }
.select-box { fill:none; stroke: var(--select-outline); stroke-width:2; }
.chart-footer { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; min-height:1.6rem; flex-wrap:wrap; }
.detail-readout { font-size:.82rem; flex:1; min-width:220px; }
.flag-pill { display:inline-block; font-size:.72rem; font-weight:600; border-radius:3px; padding:.06rem .42rem; margin-left:.3rem; }
.flag-pill.sev-warning { background: var(--warning-tint); color: var(--warning); }
.flag-pill.sev-reject { background: var(--reject-tint); color: var(--reject); }
.flag-pill.sev-ok { background: var(--ok-tint); color: var(--ok); }
.note-editor { border:1px solid var(--line); border-radius:5px; padding:.6rem .75rem; margin-top:.55rem; background: var(--paper); }
.note-editor .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; }
.note-editor label { flex:1; min-width:180px; }
.note-shown { font-size:.78rem; color: var(--muted); margin-top:.35rem; }
.quick-add { display:flex; align-items:flex-end; gap:.6rem; margin-top:.65rem; padding-top:.6rem; border-top:1px dashed var(--line); flex-wrap:wrap; }
.empty-chart { padding:2.2rem 1rem; text-align:center; color: var(--muted); background: var(--band-outer); border-radius:4px; font-size:.85rem; }
.empty-hint { color: var(--muted); }

.violation-mini { border:1px solid var(--line); border-left:3px solid var(--reject); border-radius:4px; padding:.55rem .85rem; margin-bottom:1rem; font-size:.81rem; background:#fff; }
.violation-mini ul { margin:.35rem 0 0; padding-left:1.1rem; }
.violation-mini li { margin-bottom:.1rem; }

.v-controls { display:flex; gap:1.1rem; align-items:flex-end; margin-bottom:.8rem; flex-wrap:wrap; }
.v-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.v-table th, .v-table td { text-align:left; padding:.5rem .7rem; border-bottom:1px solid var(--line); font-size:.81rem; }
.v-table th { background: var(--paper); font-weight:600; }
.v-table tr.clickable { cursor:pointer; }
.sev-row-reject td { background: var(--reject-tint); }
.sev-row-warning td { background: var(--warning-tint); }
.v-detail td { background:#fff; }
.v-detail-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:.35rem .9rem; font-size:.78rem; }
.v-detail-grid div span { color: var(--muted); }

.settings-card { border:1px solid var(--line); border-radius:6px; background:#fff; padding:1.05rem 1.15rem; margin-bottom:1.1rem; }
.settings-card.accent { border-left:3px solid var(--brand); }
.rule-grid { display:flex; flex-wrap:wrap; gap:.55rem 1.5rem; margin-top:.5rem; }
.rule-toggle { flex-direction:row; align-items:center; gap:.4rem; font-size:.84rem; color: var(--ink); }
.data-actions { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 .3rem; align-items:flex-end; }
.instrument-settings { border-top:1px solid var(--line); padding-top:.9rem; margin-top:.9rem; }
.instrument-settings:first-of-type { border-top:none; padding-top:0; margin-top:0; }
.instrument-settings-head { display:flex; gap:.5rem; margin-bottom:.4rem; flex-wrap:wrap; align-items:center; }
.instrument-settings-head input { flex:1; min-width:160px; }
.shared-note { font-size:.78rem; color: var(--muted); margin:.1rem 0 .5rem; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
.assay-settings { border:1px dashed var(--line); border-radius:5px; padding:.75rem; margin:.65rem 0; }
.assay-settings-head { display:flex; gap:.5rem; margin-bottom:.55rem; align-items:center; flex-wrap:wrap; }
.assay-settings-head input { min-width:120px; }
.level-settings-row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:.45rem; }
.level-settings-row > span:first-child { font-weight:600; align-self:center; min-width:1.4rem; }
.level-settings-row input { max-width:130px; }
.points-table-wrap { max-height:170px; overflow-y:auto; border:1px solid var(--line); border-radius:4px; margin:.3rem 0 .8rem; }
.points-table { width:100%; border-collapse:collapse; font-size:.77rem; }
.points-table th, .points-table td { padding:.28rem .55rem; border-bottom:1px solid var(--line); text-align:left; }
.points-table tr.voided td { color: var(--muted); text-decoration: line-through; }
.points-table tr.voided td.reason { text-decoration:none; font-style:italic; }
.add-instrument-form, .add-assay-form { display:flex; gap:.55rem; margin-top:.7rem; flex-wrap:wrap; }

/* shared control profile card */
.profile-card { display:grid; grid-template-columns: 1fr auto; gap:1rem; align-items:start; }
.profile-facts { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:.45rem 1.1rem; font-size:.81rem; margin-top:.5rem; }
.profile-facts div span { color: var(--muted); display:block; font-size:.73rem; }
.profile-facts div strong { font-family: var(--font-num); font-weight:600; }
.profile-actions { display:flex; flex-direction:column; gap:.4rem; }
.serial-list { font-family: var(--font-num); font-size:.78rem; color: var(--muted); }

/* shared profile editor */
.editor-head { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:.6rem; }
.unsaved-badge { font-size:.72rem; font-weight:600; color: var(--warning); background: var(--warning-tint); border-radius:3px; padding:.08rem .45rem; }
.editor-levels { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:.9rem; margin:.7rem 0 1rem; }
.editor-level { border:1px solid var(--line); border-radius:5px; padding:.7rem .8rem; }
.editor-level h3 { margin-bottom:.5rem; }
.editor-level label { margin-bottom:.45rem; }
.editor-level input { width:100%; }
.target-table { width:100%; border-collapse:collapse; font-size:.8rem; }
.target-table th, .target-table td { padding:.35rem .5rem; border-bottom:1px solid var(--line); text-align:left; }
.target-table th { background: var(--paper); font-weight:600; font-size:.75rem; }
.target-table input { width:100%; max-width:110px; }
.target-table td.calc { font-family: var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.editor-actions { display:flex; gap:.6rem; margin-top:.9rem; align-items:center; flex-wrap:wrap; }
.archived-lot { border:1px solid var(--line); border-radius:5px; padding:.6rem .8rem; margin-bottom:.5rem; font-size:.8rem; background: var(--paper); }
.archived-lot strong { font-family: var(--font-num); }

/* batch entry */
.batch-head { display:flex; gap:.9rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; }
.batch-instrument { border:1px solid var(--line); border-radius:6px; background:#fff; padding:.85rem 1rem; margin-bottom:.8rem; }
.batch-instrument h3 { margin-bottom:.1rem; }
.batch-serial { font-family: var(--font-num); font-size:.77rem; color: var(--muted); margin-bottom:.6rem; }
.batch-grid { display:grid; grid-template-columns: 70px repeat(auto-fit, minmax(110px,1fr)); gap:.4rem .7rem; align-items:center; }
.batch-grid .bh { font-size:.74rem; color: var(--muted); font-weight:600; }
.batch-grid .blabel { font-weight:600; font-size:.82rem; }
.batch-grid input { width:100%; }
.batch-target { font-size:.68rem; color: var(--muted); font-family: var(--font-num); }
.changelog-list { font-size:.78rem; color: var(--muted); max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:4px; padding:.5rem .7rem; }
.changelog-list div { margin-bottom:.2rem; }

/* print */
.print-header { display:none; }
@media print {
  .no-print { display:none !important; }
  body { background:#fff; font-size:11pt; }
  main.view { max-width:none; padding:0; }
  .print-header { display:block; border-bottom:2px solid #000; margin-bottom:.6rem; padding-bottom:.4rem; }
  .print-header .ph-inst { font-size:13pt; font-weight:700; }
  .print-header .ph-dept { font-size:10pt; }
  .print-header .ph-title { font-size:11pt; font-weight:600; margin-top:.2rem; }
  .print-header .ph-meta { font-size:8.5pt; color:#333; margin-top:.15rem; }
  .level-panel { break-inside:avoid; page-break-inside:avoid; border-color:#999; }
  .inst-card { break-inside:avoid; }
  .v-table { break-inside:auto; }
  .v-table tr { break-inside:avoid; }
  .settings-card { break-inside:avoid; }
  .violation-mini { display:block !important; break-inside:avoid; }
  a[href]:after { content:""; }
}
@media (max-width:720px) {
  .level-panel { grid-template-columns:1fr; }
  .level-info { border-right:none; border-bottom:1px solid var(--line); padding-right:0; padding-bottom:.6rem; flex-direction:row; flex-wrap:wrap; }
  .li-row { flex:1 1 45%; justify-content:flex-start; gap:.3rem; }
  main.view { padding:1rem; }
  .topbar { padding:.6rem .9rem; }
  .profile-card { grid-template-columns:1fr; }
  .profile-actions { flex-direction:row; flex-wrap:wrap; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition:none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ============================================================
   MMC Pathology QC Dashboard
   Data schema v2.

   Key architectural rule:
     Shared control MATERIAL/TARGETS  !=  shared instrument QC HISTORY.
   The three EasyLyte Plus analyzers share one control profile
   (control name, lot, expiry, target mean/SD per analyte/level).
   Every analyzer keeps its OWN result points, z-scores, Westgard
   evaluation, comments and corrective actions. Nothing in this
   file may merge result arrays across instruments.
   ============================================================ */

/* ---------- generic helpers ---------- */
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtNum(n, dp) { return (typeof n==='number' && isFinite(n)) ? n.toFixed(dp==null?2:dp) : '—'; }
function num(v) { const n = parseFloat(v); return isFinite(n) ? n : null; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad2(n) { return String(n).padStart(2,'0'); }
function fmtDateTime(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  if (isNaN(d.getTime())) return dt;
  return `${pad2(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtDate(ds) {
  if (!ds) return '—';
  const d = new Date(ds);
  if (isNaN(d.getTime())) return ds;
  return `${pad2(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function nowISO() { return new Date().toISOString(); }
function nowLocalInputValue() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function clampZ(z) { if (z==null) return 0; return Math.max(-3.45, Math.min(3.45, z)); }
function worstSeverity(flags) {
  if (!flags || !flags.length) return 'none';
  return flags.some(f=>f.severity==='reject') ? 'reject' : 'warning';
}
function statusLabel(s) { return s==='reject' ? 'Reject — rule violated' : s==='warning' ? 'Warning' : 'In control'; }
function safeFilename(s) { return String(s).replace(/[^\w\-]+/g,'_'); }
function isValidDateStr(s) { if (!s) return false; const d = new Date(s); return !isNaN(d.getTime()); }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

/* Days from today until a date string. Negative = already past. */
function daysUntil(ds) {
  if (!isValidDateStr(ds)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(ds); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
/* Expiry state used for the amber/red control-expiry indicators. */
function expiryStatus(ds) {
  const d = daysUntil(ds);
  if (d === null) return { state:'none', days:null, label:'No expiry set' };
  if (d < 0) return { state:'expired', days:d, label:'CONTROL EXPIRED' };
  if (d <= 30) return { state:'soon', days:d, label:`Expires in ${d} day${d===1?'':'s'}` };
  return { state:'ok', days:d, label:'In date' };
}
function expiryPill(ds) {
  const st = expiryStatus(ds);
  if (st.state==='none') return '';
  const cls = st.state==='expired' ? 'pill-expired' : st.state==='soon' ? 'pill-soon' : 'pill-ok';
  return `<span class="pill ${cls}">${esc(st.label)}</span>`;
}
/* Worst expiry state across a lot's levels — used for the summary card. */
function lotExpiryState(lot) {
  if (!lot) return { state:'none', label:'No active lot' };
  const a = expiryStatus(lot.level1 && lot.level1.expiry);
  const b = expiryStatus(lot.level2 && lot.level2.expiry);
  const rank = { expired:3, soon:2, ok:1, none:0 };
  return rank[a.state] >= rank[b.state] ? a : b;
}
function csvCell(v) {
  const s = (v==null ? '' : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const INSTITUTION = 'Mardan Medical Complex';
const DEPARTMENT = 'Pathology Department';

/* A QC result point. mean/sd are SNAPSHOTS of the targets that applied when
   the result was entered, so a later lot change never rewrites history. */
function makePoint(o) {
  return {
    id: uid(),
    datetime: o.datetime,
    value: o.value,
    operator: o.operator || '',
    profileId: o.profileId || null,
    lotId: o.lotId || null,
    lotLabel: o.lotLabel || '',
    mean: (typeof o.mean === 'number' && isFinite(o.mean)) ? o.mean : null,
    sd: (typeof o.sd === 'number' && o.sd > 0) ? o.sd : null,
    status: 'active',
    comment: '',
    correctiveAction: '',
    resolution: '',
    voidReason: '',
    voidedAt: '',
    createdAt: nowISO()
  };
}

const DEFAULT_RULES = { r12s:true, r13s:true, r22s:true, r4s:true, r41s:true, rNx:true, rNxN:10, r7t:true };

/* ---------- app state (UI only — persisted data lives in state.data) ---------- */
let state = {
  view: 'overview',
  activeInstrumentId: null,
  activeAssayIndex: 0,
  selected: null,          // { key, pointIndex }
  noteEditor: null,        // { key, pointId }
  violationFilter: '',
  resolutionFilter: '',
  violationSort: 'desc',
  expandedViolation: null,
  editingProfile: null,    // { profileId, mode:'edit'|'new', draft:{...}, dirty:false, errors:[] }
  showArchivedLots: false,
  batchDraft: null,        // { datetime, operator, values:{} }
  toast: '',
  data: null,
  rules: null
};

const LS_DATA = 'mmc_qc_data_v1';   // key retained so existing saved data is picked up and migrated
const LS_RULES = 'mmc_qc_rules_v1';

function loadState() {
  let data = null, rules = null;
  try {
    const d = localStorage.getItem(LS_DATA);
    if (d) data = JSON.parse(d);
    const r = localStorage.getItem(LS_RULES);
    if (r) rules = JSON.parse(r);
  } catch (e) { console.warn('Could not read saved QC data', e); }
  if (data && Array.isArray(data.instruments)) {
    state.data = migrateData(data);
  } else {
    state.data = buildSeed();
  }
  state.rules = Object.assign({}, DEFAULT_RULES, rules || {});
}
function saveState() {
  try {
    localStorage.setItem(LS_DATA, JSON.stringify(state.data));
    localStorage.setItem(LS_RULES, JSON.stringify(state.rules));
  } catch (e) { console.warn('Could not save QC data', e); }
}
function renderAndSave() { saveState(); render(); }
function flash(msg) { state.toast = msg; }

/* ---------- migration (v1 -> v2), idempotent ---------- */
function looksElectrolyte(inst) {
  return /easylyte/i.test(inst.name || '');
}
function migrateData(data) {
  /* Already v2: just normalise anything missing and return. */
  if (data.schemaVersion === 2) return normaliseData(data);

  const out = deepCopy(data);
  out.schemaVersion = 2;
  out.institution = out.institution || INSTITUTION;
  out.department = out.department || DEPARTMENT;
  out.changeLog = Array.isArray(out.changeLog) ? out.changeLog : [];

  /* Build a shared electrolyte profile from whatever the old EasyLyte
     entries already held, so nothing the lab typed in is lost. */
  const electro = (out.instruments || []).filter(looksElectrolyte);
  if (!out.sharedControlProfiles) out.sharedControlProfiles = {};
  if (!out.sharedControlProfiles.electrolyte && electro.length) {
    const lotId = 'lot-migrated-' + uid();
    const analytes = {};
    let controlName = '', l1 = { lot:'', expiry:'' }, l2 = { lot:'', expiry:'' };
    electro.forEach(function (inst) {
      (inst.assays || []).forEach(function (assay) {
        (assay.levels || []).forEach(function (lvl) {
          const key = 'level' + lvl.level;
          if (!analytes[assay.name]) analytes[assay.name] = {};
          /* first non-zero definition found wins as the shared target */
          if (!analytes[assay.name][key] && (lvl.mean || lvl.sd)) {
            analytes[assay.name][key] = { mean: lvl.mean || 0, sd: lvl.sd || 0 };
          }
          if (!controlName && lvl.controlName) controlName = lvl.controlName;
          if (lvl.level === 1 && !l1.lot && lvl.controlLot) l1 = { lot: lvl.controlLot, expiry: lvl.expDate || '' };
          if (lvl.level === 2 && !l2.lot && lvl.controlLot) l2 = { lot: lvl.controlLot, expiry: lvl.expDate || '' };
        });
      });
    });
    ELECTROLYTE_ANALYTES.forEach(function (a) {
      if (!analytes[a]) analytes[a] = {};
      if (!analytes[a].level1) analytes[a].level1 = { mean:0, sd:0 };
      if (!analytes[a].level2) analytes[a].level2 = { mean:0, sd:0 };
    });
    out.sharedControlProfiles.electrolyte = {
      id: 'electrolyte',
      label: 'Electrolyte Control',
      activeLotId: lotId,
      lots: [{
        id: lotId,
        controlName: controlName || 'Electrolyte Control',
        level1: l1, level2: l2,
        analytes: analytes,
        createdAt: nowISO(), archivedAt: null,
        note: 'Created automatically from existing instrument settings during upgrade'
      }]
    };
    out.changeLog.push({ at: nowISO(), action: 'migrate', detail: 'Upgraded to schema v2; shared electrolyte control profile created from existing EasyLyte settings.' });
  }

  const profile = out.sharedControlProfiles.electrolyte;
  const activeLot = profile ? profile.lots.find(function (l) { return l.id === profile.activeLotId; }) : null;

  (out.instruments || []).forEach(function (inst) {
    if (inst.sharedProfile === undefined) inst.sharedProfile = (looksElectrolyte(inst) && profile) ? 'electrolyte' : null;
    if (inst.overrideEnabled === undefined) inst.overrideEnabled = false;
    if (!inst.overrides) inst.overrides = {};
    (inst.assays || []).forEach(function (assay) {
      (assay.levels || []).forEach(function (lvl) {
        const key = 'level' + lvl.level;
        lvl.points = (lvl.points || []).map(function (p) {
          /* Stamp each historical point with the mean/SD that was in force for it,
             so old charts keep their original context after any future lot change. */
          const stamped = Object.assign({
            id: p.id || uid(), operator:'', profileId:null, lotId:null, lotLabel:'',
            mean:null, sd:null, status:'active', comment:'', correctiveAction:'',
            resolution:'', voidReason:'', voidedAt:'', createdAt: nowISO()
          }, p);
          if (stamped.mean == null && isFinite(lvl.mean) && lvl.mean !== 0) stamped.mean = lvl.mean;
          if (stamped.sd == null && lvl.sd > 0) stamped.sd = lvl.sd;
          if (inst.sharedProfile === 'electrolyte' && activeLot) {
            if (!stamped.profileId) stamped.profileId = 'electrolyte';
            if (!stamped.lotId) stamped.lotId = activeLot.id;
            if (!stamped.lotLabel) stamped.lotLabel = (activeLot[key] && activeLot[key].lot) || '';
            const an = activeLot.analytes[assay.name];
            if (stamped.mean == null && an && an[key]) stamped.mean = an[key].mean;
            if (stamped.sd == null && an && an[key] && an[key].sd > 0) stamped.sd = an[key].sd;
          }
          return stamped;
        });
      });
    });
  });
  return normaliseData(out);
}

/* Fill in any fields a hand-edited or partial file might be missing. */
function normaliseData(data) {
  data.schemaVersion = 2;
  data.institution = data.institution || INSTITUTION;
  data.department = data.department || DEPARTMENT;
  if (!data.sharedControlProfiles) data.sharedControlProfiles = {};
  if (!Array.isArray(data.changeLog)) data.changeLog = [];
  (data.instruments || []).forEach(function (inst) {
    if (!inst.id) inst.id = uid();
    if (inst.sharedProfile === undefined) inst.sharedProfile = null;
    if (inst.overrideEnabled === undefined) inst.overrideEnabled = false;
    if (!inst.overrides) inst.overrides = {};
    (inst.assays || []).forEach(function (assay) {
      (assay.levels || []).forEach(function (lvl) {
        if (!Array.isArray(lvl.points)) lvl.points = [];
        lvl.points.forEach(function (p) {
          if (!p.id) p.id = uid();
          if (!p.status) p.status = 'active';
          if (p.operator === undefined) p.operator = '';
          if (p.comment === undefined) p.comment = '';
          if (p.correctiveAction === undefined) p.correctiveAction = '';
          if (p.resolution === undefined) p.resolution = '';
        });
      });
    });
  });
  return data;
}

/* ---------- shared-profile helpers ---------- */
function getSharedControlProfile(profileId) {
  return (state.data.sharedControlProfiles && state.data.sharedControlProfiles[profileId]) || null;
}
function getActiveControlLot(profileId) {
  const p = getSharedControlProfile(profileId);
  if (!p || !p.lots || !p.lots.length) return null;
  return p.lots.find(function (l) { return l.id === p.activeLotId; }) || p.lots[p.lots.length-1];
}
function getLotById(profileId, lotId) {
  const p = getSharedControlProfile(profileId);
  if (!p) return null;
  return p.lots.find(function (l) { return l.id === lotId; }) || null;
}
function getArchivedLots(profileId) {
  const p = getSharedControlProfile(profileId);
  if (!p) return [];
  return p.lots.filter(function (l) { return l.id !== p.activeLotId; })
               .sort(function (a,b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
}
function getElectrolyteInstruments() {
  return state.data.instruments.filter(function (i) { return i.sharedProfile === 'electrolyte'; });
}
function getInstrument(id) {
  return state.data.instruments.find(function (i) { return i.id === id; }) || null;
}

/* Resolve which control settings apply RIGHT NOW to one instrument/assay/level.
   Priority: instrument override > shared profile > instrument's own fields. */
function getApplicableQCSettings(inst, assayName, levelObj) {
  const key = 'level' + levelObj.level;
  if (inst.sharedProfile) {
    const lot = getActiveControlLot(inst.sharedProfile);
    if (lot) {
      const an = lot.analytes && lot.analytes[assayName];
      const lvlInfo = lot[key] || { lot:'', expiry:'' };
      let mean = an && an[key] ? an[key].mean : null;
      let sd = an && an[key] ? an[key].sd : null;
      let source = 'shared';
      const ov = inst.overrideEnabled && inst.overrides && inst.overrides[assayName] && inst.overrides[assayName][key];
      if (ov && isFinite(ov.mean) && ov.sd > 0) { mean = ov.mean; sd = ov.sd; source = 'override'; }
      return {
        mean: mean, sd: sd, controlName: lot.controlName,
        lot: lvlInfo.lot, expiry: lvlInfo.expiry,
        source: source, profileId: inst.sharedProfile, lotId: lot.id
      };
    }
  }
  return {
    mean: levelObj.mean, sd: levelObj.sd, controlName: levelObj.controlName,
    lot: levelObj.controlLot, expiry: levelObj.expDate,
    source: 'instrument', profileId: null, lotId: null
  };
}

/* ---------- Westgard engine ----------
   IMPORTANT: every function below receives points from ONE instrument,
   ONE assay. Sequential rules must never see another analyzer's results. */

/* z uses the point's own historical snapshot when present, so results entered
   under a previous lot keep their original z even after the targets change. */
function zFor(point, applicable) {
  const mean = (typeof point.mean === 'number' && isFinite(point.mean)) ? point.mean : applicable.mean;
  const sd = (typeof point.sd === 'number' && point.sd > 0) ? point.sd : applicable.sd;
  if (!isFinite(mean) || !(sd > 0)) return null;
  return { z: (point.value - mean) / sd, mean: mean, sd: sd };
}

function evaluateLevel(points, applicable, rules) {
  const zs = points.map(function (p) {
    const r = zFor(p, applicable);
    return Object.assign({}, p, { z: r ? r.z : null, appliedMean: r ? r.mean : null, appliedSd: r ? r.sd : null, flags: [] });
  });
  for (let i=0; i<zs.length; i++) {
    const z = zs[i].z;
    if (z == null) continue;
    if (rules.r13s && Math.abs(z) > 3) zs[i].flags.push({ rule:'1-3s', severity:'reject' });
    else if (rules.r12s && Math.abs(z) > 2) zs[i].flags.push({ rule:'1-2s', severity:'warning' });

    if (rules.r22s && i>=1 && zs[i-1].z != null) {
      if (z>2 && zs[i-1].z>2) zs[i].flags.push({ rule:'2-2s', severity:'reject' });
      if (z<-2 && zs[i-1].z<-2) zs[i].flags.push({ rule:'2-2s', severity:'reject' });
    }
    if (rules.r41s && i>=3) {
      const w = [zs[i-3].z, zs[i-2].z, zs[i-1].z, z];
      if (w.every(function (v) { return v != null && v>1; })) zs[i].flags.push({ rule:'4-1s', severity:'reject' });
      if (w.every(function (v) { return v != null && v<-1; })) zs[i].flags.push({ rule:'4-1s', severity:'reject' });
    }
    if (rules.rNx) {
      const N = rules.rNxN || 10;
      if (i >= N-1) {
        const w = zs.slice(i-N+1, i+1).map(function (p) { return p.z; });
        if (w.every(function (v) { return v != null && v>0; })) zs[i].flags.push({ rule:N+'-x', severity:'reject' });
        if (w.every(function (v) { return v != null && v<0; })) zs[i].flags.push({ rule:N+'-x', severity:'reject' });
      }
    }
    if (rules.r7t && i>=6) {
      const w = zs.slice(i-6, i+1).map(function (p) { return p.value; });
      let inc = true, dec = true;
      for (let k=1; k<w.length; k++) { if (!(w[k]>w[k-1])) inc=false; if (!(w[k]<w[k-1])) dec=false; }
      if (inc || dec) zs[i].flags.push({ rule:'7-T', severity:'reject' });
    }
  }
  return zs;
}

/* Within-run rules (R-4s, across-level 2-2s) compare the levels of the SAME
   assay on the SAME instrument, run on the same calendar day. */
function evaluateWithinRun(evalLevels, rules) {
  const byDate = {};
  evalLevels.forEach(function (lvl, li) {
    lvl.points.forEach(function (p, pi) {
      if (p.z == null) return;
      const d = (p.datetime || '').slice(0,10);
      if (!d) return;
      (byDate[d] = byDate[d] || []).push({ levelIndex:li, pointIndex:pi, z:p.z });
    });
  });
  const flags = [];
  Object.keys(byDate).forEach(function (d) {
    const entries = byDate[d];
    if (entries.length < 2) return;
    if (rules.r4s) {
      let maxE = entries[0], minE = entries[0];
      entries.forEach(function (e) { if (e.z > maxE.z) maxE = e; if (e.z < minE.z) minE = e; });
      if (maxE.z - minE.z > 4) {
        flags.push({ levelIndex:maxE.levelIndex, pointIndex:maxE.pointIndex, rule:'R-4s', severity:'reject' });
        flags.push({ levelIndex:minE.levelIndex, pointIndex:minE.pointIndex, rule:'R-4s', severity:'reject' });
      }
    }
    if (rules.r22s) {
      for (let a=0; a<entries.length; a++) {
        for (let b=a+1; b<entries.length; b++) {
          if (entries[a].levelIndex === entries[b].levelIndex) continue;
          if ((entries[a].z>2 && entries[b].z>2) || (entries[a].z<-2 && entries[b].z<-2)) {
            flags.push({ levelIndex:entries[a].levelIndex, pointIndex:entries[a].pointIndex, rule:'2-2s (within-run)', severity:'reject' });
            flags.push({ levelIndex:entries[b].levelIndex, pointIndex:entries[b].pointIndex, rule:'2-2s (within-run)', severity:'reject' });
          }
        }
      }
    }
  });
  return flags;
}

/* Full evaluation for one assay on ONE instrument.
   Returns levels with evaluated point copies (voided results excluded). */
function getEvaluatedAssay(inst, assayIndex) {
  const assay = inst.assays[assayIndex];
  if (!assay) return [];
  const evalLevels = assay.levels.map(function (lvl) {
    const applicable = getApplicableQCSettings(inst, assay.name, lvl);
    const active = lvl.points
      .filter(function (p) { return p.status !== 'voided'; })
      .slice()
      .sort(function (a,b) { return String(a.datetime).localeCompare(String(b.datetime)); });
    return Object.assign({}, lvl, {
      applicable: applicable,
      points: evaluateLevel(active, applicable, state.rules)
    });
  });
  const runFlags = evaluateWithinRun(evalLevels, state.rules);
  runFlags.forEach(function (f) {
    const pt = evalLevels[f.levelIndex] && evalLevels[f.levelIndex].points[f.pointIndex];
    if (pt && !pt.flags.some(function (x) { return x.rule === f.rule; })) {
      pt.flags.push({ rule:f.rule, severity:f.severity });
    }
  });
  return evalLevels;
}

/* Per-instrument status for the overview cards. One analyzer's violation
   must never change another analyzer's card. */
function instrumentSummary(inst) {
  let status = 'ok', count = 0, openIssues = 0;
  inst.assays.forEach(function (assay, ai) {
    getEvaluatedAssay(inst, ai).forEach(function (lvl) {
      lvl.points.forEach(function (p, pi) {
        if (p.flags.length) {
          count += p.flags.length;
          if (p.resolution !== 'Resolved') openIssues++;
          if (pi === lvl.points.length-1) {
            const worst = worstSeverity(p.flags);
            if (worst === 'reject') status = 'reject';
            else if (worst === 'warning' && status !== 'reject') status = 'warning';
          }
        }
      });
    });
  });
  return { status: status, count: count, openIssues: openIssues };
}

/* Flat violation records across every instrument, each carrying its own
   serial number so the three identically named EasyLytes stay distinguishable. */
function collectViolations() {
  const rows = [];
  state.data.instruments.forEach(function (inst) {
    inst.assays.forEach(function (assay, ai) {
      getEvaluatedAssay(inst, ai).forEach(function (lvl) {
        lvl.points.forEach(function (p) {
          p.flags.forEach(function (f) {
            rows.push({
              date: p.datetime, instrument: inst.name, serial: inst.serial,
              instrumentId: inst.id, assay: assay.name, unit: assay.unit || '',
              level: lvl.level, value: p.value, rule: f.rule, severity: f.severity,
              controlName: lvl.applicable.controlName, lot: p.lotLabel || lvl.applicable.lot,
              mean: p.appliedMean, sd: p.appliedSd, z: p.z,
              operator: p.operator, comment: p.comment,
              correctiveAction: p.correctiveAction,
              resolution: p.resolution || 'Open',
              pointId: p.id, assayIndex: ai
            });
          });
        });
      });
    });
  });
  return rows;
}

function hasDemoData() {

function logChange(action, detail) {

}

/* ---------- Levey-Jennings chart ----------
   Plotted in SD units, so points carrying different historical mean/SD
   (different control lots) still share one chart correctly. */
function buildChartSVG(key, offset, visiblePoints, selGlobalIndex) {
  const W=900, H=220, padL=42, padR=14, padT=10, padB=10;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const yFor = function (z) { return padT + (3.5-z)/7*plotH; };
  const n = visiblePoints.length;
  const xFor = function (i) { return n<=1 ? padL+plotW/2 : padL + (i/(n-1))*plotW; };

  const bands = [
    [3,3.5,'band-outer'], [2,3,'band-red'], [1,2,'band-yellow'],
    [-1,1,'band-green'], [-2,-1,'band-yellow'], [-3,-2,'band-red'], [-3.5,-3,'band-outer']
  ];
  let s = `<svg viewBox="0 0 ${W} ${H}" class="lj-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Levey-Jennings chart">`;
  bands.forEach(function (b) {
    const y1 = yFor(b[1]), y2 = yFor(b[0]);
    s += `<rect x="${padL}" y="${y1.toFixed(1)}" width="${plotW}" height="${(y2-y1).toFixed(1)}" class="${b[2]}"></rect>`;
  });
  [-3,-2,-1,0,1,2,3].forEach(function (z) {
    const y = yFor(z);
    s += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" class="grid-line"></line>`;
    const label = z===0 ? 'Mean' : (z>0 ? '+'+z+'SD' : z+'SD');
    s += `<text x="${padL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" class="lj-axis-label">${label}</text>`;
  });

  /* Mark where the control lot changed, so a shift in targets is visible. */
  for (let i=1; i<n; i++) {
    if (visiblePoints[i].lotId && visiblePoints[i-1].lotId && visiblePoints[i].lotId !== visiblePoints[i-1].lotId) {
      const x = (xFor(i-1) + xFor(i)) / 2;
      s += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${(padT+plotH).toFixed(1)}" class="lot-divider"></line>`;
      s += `<text x="${(x+3).toFixed(1)}" y="${(padT+9).toFixed(1)}" class="lot-divider-label">new lot</text>`;
    }
  }

  if (n>1) {
    const pts = visiblePoints.map(function (p,i) { return `${xFor(i).toFixed(1)},${yFor(clampZ(p.z)).toFixed(1)}`; }).join(' ');
    s += `<polyline points="${pts}" class="lj-line"></polyline>`;
  }
  visiblePoints.forEach(function (p,i) {
    const x = xFor(i), y = yFor(clampZ(p.z));
    const gi = offset+i;
    const sev = worstSeverity(p.flags);
    const dotCls = sev==='reject' ? 'dot-reject' : sev==='warning' ? 'dot-warning' : 'dot-normal';
    if (gi === selGlobalIndex) {
      s += `<rect x="${(x-8).toFixed(1)}" y="${(y-8).toFixed(1)}" width="16" height="16" class="select-box"></rect>`;
    }
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" class="lj-hit" data-action="select-point" data-key="${key}" data-point-index="${gi}"></circle>`;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" class="lj-dot ${dotCls}" data-action="select-point" data-key="${key}" data-point-index="${gi}"></circle>`;
  });
  s += `</svg>`;
  return s;
}

function renderOverview() {
